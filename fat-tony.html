<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPE FAT TONY - Oasis del Sur</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .quantity-box {
            margin-top: 30px;
            text-align: center;
        }
        .quantity-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .quantity-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .quantity-buttons button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .quantity-buttons button:hover {
            transform: scale(1.05);
        }
        .quantity-buttons button.selected {
            background: #00c853;
            color: white;
        }
        .selected-quantity {
            margin-top: 15px;
            font-size: 17px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="section-title">
        💨 VAPE FAT TONY
    </div>
    <div class="back-button">
        <a href="VAPE.html">
            ← VAPE
        </a>
    </div>
    <div class="product">
        <img
            src="IMG_9798.png"
            class="product-image"
            alt="VAPE FAT TONY"
        >
        <img
            src="IMG_9800.png"
            class="product-image"
            alt="VAPE FAT TONY"
        >
        <img
            src="IMG_9801.png"
            class="product-image"
            alt="VAPE FAT TONY"
        >
        <video
            class="product-image"
            controls
            muted
            loop
        >
            <source
                src="IMG_8774.mov"
                type="video/quicktime"
            >
        </video>
        <!-- SCELTA QUANTITÀ -->
        <div class="quantity-box">
            <div class="quantity-title">
                Scegli quantità
            </div>
            <div class="quantity-buttons">
                <button onclick="selectQuantity(this, 1)">
                    1
                </button>
                <button onclick="selectQuantity(this, 2)">
                    2
                </button>
                <button onclick="selectQuantity(this, 5)">
                    5
                </button>
                <button onclick="selectQuantity(this, 10)">
                    10
                </button>
                <button onclick="selectQuantity(this, 50)">
                    50
                </button>
            </div>
            <div
                class="selected-quantity"
                id="selectedQuantity"
            >
                Nessuna quantità selezionata
            </div>
        </div>
    </div>
</div>
<script>
function selectQuantity(button, quantity) {
    document
        .querySelectorAll(".quantity-buttons button")
        .forEach(function(btn) {
            btn.classList.remove("selected");
        });
    button.classList.add("selected");
    document.getElementById("selectedQuantity").textContent =
        "Quantità selezionata: " + quantity;
}
</script>
</body>
</html>
