<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAT TONY - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
<style>
.product-image, .product-video {
    width: 100%;
    max-width: 600px;
    height: 350px;
    display: block;
    margin: 0 auto 20px auto;
    border-radius: 18px;
    object-fit: cover;
    object-position: center;
}
#mini-cart {
    margin-top: 15px;
    font-size: 16px;
    line-height: 1.8;
}
#mini-cart button {
    background: #e50914;
    color: white;
    border: none;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    cursor: pointer;
}
@media (max-width: 500px) {
    .product-image, .product-video {
        width: 100%;
        max-width: 100%;
        height: 280px;
        object-fit: cover;
    }
}
</style>
</head>
<body>

<div class="back-button">
    <a href="VAPE.html" id="back" data-translate="backToVapes">
        ← Torna ai Vape
    </a>
</div>

<div class="container">
    <div class="section-title">
         💨 FAT TONY
    </div>

    <div class="product">
        <!-- IMMAGINI SPECIFICHE DI FAT TONY -->
        <img src="IMG_9798.png" class="product-image" alt="FAT TONY">
        <img src="IMG_9800.png" class="product-image" alt="FAT TONY">
        <img src="IMG_9801.png" class="product-image" alt="FAT TONY">

        <!-- VIDEO DI FAT TONY -->
        <video class="product-video" controls autoplay loop muted playsinline>
            <source src="IMG_8774.mov" type="video/quicktime">
        </video>

        <h2 id="choose" data-translate="chooseQuantity">
            Scegli quantità
        </h2>
        <div class="sizes">
            <button onclick="addToCart('FAT TONY - 1pz')">1pz</button>
            <button onclick="addToCart('FAT TONY - 2pz')">2pz</button>
            <button onclick="addToCart('FAT TONY - 5pz')">5pz</button>
            <button onclick="addToCart('FAT TONY - 10pz')">10pz</button>
            <button onclick="addToCart('FAT TONY - 50pz')">50pz</button>
        </div>
    </div>

    <div class="cart">
        <div class="cart-title" data-translate="cartTitle">
            🛒 Carrello
        </div>
        <div id="mini-cart">
            <span data-translate="emptyCart">Carrello vuoto</span>
        </div>
    </div>

    <a href="shop.html" class="category-link">
        <div class="category" id="goCart" data-translate="goToCart">
            🛒 Vai al carrello
        </div>
    </a>
    <a href="shop.html" class="category-link">
        <div class="category" id="goMenu" data-translate="backToMenu">
            🏠 Torna al menu
        </div>
    </a>
</div>

<script src="language.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(product) {
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
    const lang = localStorage.getItem("language") || "it";
    const t = (typeof translations !== "undefined" && translations[lang]) ? translations[lang] : {};
    alert("✅ " + product + " " + (t.addedToCart || "aggiunto al carrello"));
}

function showMiniCart() {
    const box = document.getElementById("mini-cart");
    if (!box) return;
    const lang = localStorage.getItem("language") || "it";
    const t = (typeof translations !== "undefined" && translations[lang]) ? translations[lang] : {};
    
    if (cart.length === 0) {
        box.innerHTML = t.emptyCart || "Carrello vuoto";
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML += "• " + item + ' <button onclick="removeItem(' + index + ')">❌</button><br><br>';
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
}

window.addEventListener("load", function() {
    if (typeof translatePage === "function") {
        translatePage();
    }
    showMiniCart();
});
</script>
</body>
</html>
