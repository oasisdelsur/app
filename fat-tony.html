<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prodotto Demo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
        padding: 20px;
    }

    h1 {
        margin-bottom: 25px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    .add {
        background: white;
        color: black;
    }

    .remove {
        background: #d32f2f;
        color: white;
        margin: 5px;
    }

    #cart {
        max-width: 400px;
        margin: 30px auto;
        padding: 20px;
        background: #222;
        border-radius: 12px;
    }

    #quantity {
        font-size: 32px;
        font-weight: bold;
        margin: 15px;
    }
</style>
</head>

<body>

<h1>Prodotto Demo</h1>

<div class="buttons">
    <button class="add" onclick="addQuantity(1)">+1</button>
    <button class="add" onclick="addQuantity(2)">+2</button>
    <button class="add" onclick="addQuantity(5)">+5</button>
    <button class="add" onclick="addQuantity(10)">+10</button>
</div>

<div id="cart">
    <h2>Carrello</h2>

    <div id="quantity">0</div>
    <div>quantità totale</div>

    <br>

    <button class="remove" onclick="removeQuantity(1)">
        -1
    </button>

    <button class="remove" onclick="clearCart()">
        Svuota carrello
    </button>
</div>

<script>
const STORAGE_KEY = "prodotto_demo_quantita";

let quantity = Number(localStorage.getItem(STORAGE_KEY)) || 0;

function updateCart() {
    document.getElementById("quantity").textContent = quantity;
    localStorage.setItem(STORAGE_KEY, quantity);
}

function addQuantity(amount) {
    quantity += amount;
    updateCart();
}

function removeQuantity(amount) {
    quantity = Math.max(0, quantity - amount);
    updateCart();
}

function clearCart() {
    quantity = 0;
    localStorage.removeItem(STORAGE_KEY);
    updateCart();
}

updateCart();
</script>

</body>
</html>
