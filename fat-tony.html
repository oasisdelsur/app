<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>FAT TONY - Oasis del Sur</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
    <style>
        /* ==========================
           IMMAGINI
        ========================== */
        .product-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            max-height: 500px;
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 18px;
            object-fit: contain;
        }
        /* ==========================
           QUANTITÀ
        ========================== */
        .quantity-box {
            margin-top: 35px;
            padding: 25px 15px;
            text-align: center;
        }
        .quantity-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
            text-shadow:
                0 0 8px rgba(255,255,255,.25);
        }
        .quantity-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .quantity-buttons button {
            min-width: 55px;
            padding: 13px 18px;
            border: 1px solid
                rgba(255,255,255,.15);
            border-radius: 14px;
            background:
                rgba(20,20,20,.8);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition:
                transform .2s,
                background .2s,
                box-shadow .2s;
        }
        .quantity-buttons button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 5px 18px
                rgba(0,0,0,.4);
        }
        .quantity-buttons button.selected {
            transform: translateY(-2px);
            background:
                rgba(0,200,83,.9);
            border-color:
                rgba(255,255,255,.3);
            box-shadow:
                0 0 18px
                rgba(0,200,83,.35);
        }
        .selected-quantity {
            margin-top: 18px;
            font-size: 16px;
            font-weight: bold;
            opacity: .85;
        }
        /* ==========================
           CARRELLO MINI
        ========================== */
        #mini-cart {
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.8;
        }
        #mini-cart button {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            margin-left: 6px;
        }
        /* ==========================
           MOBILE
        ========================== */
        @media (max-width: 500px) {
            .product-image {
                width: 100%;
                max-width: 100%;
                max-height: 400px;
                object-fit: contain;
            }
        }
    </style>
</head>
<body>
    <!-- ==========================
         INDIETRO
    ========================== -->
    <div class="back-button">
        <a
            href="VAPE.html"
            id="back"
        >
            ← VAPO
        </a>
    </div>
    <div class="container">
        <!-- ==========================
             TITOLO
        ========================== -->
        <div class="section-title">
            💨 FAT TONY
        </div>
        <!-- ==========================
             PRODOTTO
        ========================== -->
        <div class="product">
            <!-- FOTO 1 -->
            <img
                src="IMG_9798.png"
                class="product-image"
                alt="FAT TONY"
            >
            <!-- FOTO 2 -->
            <img
                src="IMG_9800.png"
                class="product-image"
                alt="FAT TONY"
            >
            <!-- FOTO 3 -->
            <img
                src="IMG_9801.png"
                class="product-image"
                alt="FAT TONY"
            >
            <!-- VIDEO -->
            <video
                class="product-image"
                controls
                muted
                loop
            >
                <source
                    src="IMG_8774.mov"
                    type="video/quicktime"
                >
                Il tuo browser non supporta
                la riproduzione del video.
            </video>
            <!-- ==========================
                 SCELTA QUANTITÀ
            ========================== -->
            <div class="quantity-box">
                <div
                    class="quantity-title"
                    id="choose"
                >
                    ✦ SCEGLI LA QUANTITÀ ✦
                </div>
                <div class="quantity-buttons">
                    <button
                        type="button"
                        onclick="addToCart('FAT TONY', 1)"
                    >
                        1
                    </button>
                    <button
                        type="button"
                        onclick="addToCart('FAT TONY', 2)"
                    >
                        2
                    </button>
                    <button
                        type="button"
                        onclick="addToCart('FAT TONY', 5)"
                    >
                        5
                    </button>
                    <button
                        type="button"
                        onclick="addToCart('FAT TONY', 10)"
                    >
                        10
                    </button>
                    <button
                        type="button"
                        onclick="addToCart('FAT TONY', 50)"
                    >
                        50
                    </button>
                </div>
                <div
                    class="selected-quantity"
                    id="selectedQuantity"
                >
                    Nessuna quantità selezionata
                </div>
            </div>
        </div>
        <!-- ==========================
             CARRELLO
        ========================== -->
        <div class="cart">
            <div class="cart-title">
                🛒
                <span id="cartText">
                    Il tuo ordine
                </span>
            </div>
            <div id="mini-cart">
                Carrello vuoto
            </div>
        </div>
        <!-- ==========================
             VAI AL CARRELLO
        ========================== -->
        <a
            href="shop.html"
            class="category-link"
        >
            <div
                class="category"
                id="goCart"
            >
                🛒 Vai al carrello
            </div>
        </a>
        <!-- ==========================
             TORNA A VAPO
        ========================== -->
        <a
            href="VAPE.html"
            class="category-link"
        >
            <div
                class="category"
                id="goVape"
            >
                ← Torna ai VAPO
            </div>
        </a>
        <!-- ==========================
             TORNA AL MENU
        ========================== -->
        <a
            href="shop.html"
            class="category-link"
        >
            <div
                class="category"
                id="goMenu"
            >
                🏠 Torna al menu
            </div>
        </a>
    </div>
    <!-- ==========================
         LINGUA
    ========================== -->
    <script src="language.js"></script>
    <!-- ==========================
         CARRELLO
    ========================== -->
    <script>
        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];
        /* ==========================
           AGGIUNGI AL CARRELLO
        ========================== */
        function addToCart(
            product,
            quantity
        ) {
            /*
             * Aggiunge la quantità
             * come voce separata,
             * esattamente come Highland Terps.
             */
            for (
                let i = 0;
                i < quantity;
                i++
            ) {
                cart.push(product);
            }
            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );
            /*
             * Mostra quantità selezionata
             */
            document.getElementById(
                "selectedQuantity"
            ).textContent =
                "Quantità selezionata: " +
                quantity;
            /*
             * Aggiorna carrello
             */
            showMiniCart();
            /*
             * Messaggio
             */
            const lang =
                localStorage.getItem(
                    "language"
                ) || "it";
            const t =
                typeof translations !== "undefined"
                    ? (
                        translations[lang] ||
                        translations.it
                    )
                    : {};
            alert(
                "✅ FAT TONY x" +
                quantity +
                " " +
                (
                    t.addedToCart ||
                    "aggiunto al carrello"
                )
            );
        }
        /* ==========================
           MOSTRA CARRELLO
        ========================== */
        function showMiniCart() {
            const box =
                document.getElementById(
                    "mini-cart"
                );
            if (!box) {
                return;
            }
            const lang =
                localStorage.getItem(
                    "language"
                ) || "it";
            const t =
                typeof translations !== "undefined"
                    ? (
                        translations[lang] ||
                        translations.it
                    )
                    : {};
            if (
                cart.length === 0
            ) {
                box.innerHTML =
                    t.emptyCart ||
                    "Carrello vuoto";
                return;
            }
            /*
             * Conta quante FAT TONY
             * sono presenti
             */
            const fatTonyCount =
                cart.filter(
                    function(item) {
                        return item === "FAT TONY";
                    }
                ).length;
            box.innerHTML =
                "• FAT TONY x" +
                fatTonyCount +
                ' <button onclick="removeFatTony()">❌</button>';
        }
        /* ==========================
           RIMUOVI 1 FAT TONY
        ========================== */
        function removeFatTony() {
            const index =
                cart.lastIndexOf(
                    "FAT TONY"
                );
            if (index !== -1) {
                cart.splice(
                    index,
                    1
                );
            }
            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );
            showMiniCart();
            /*
             * Aggiorna il testo
             */
            const remaining =
                cart.filter(
                    function(item) {
                        return item === "FAT TONY";
                    }
                ).length;
            if (remaining === 0) {
                document.getElementById(
                    "selectedQuantity"
                ).textContent =
                    "Nessuna quantità selezionata";
            }
            else {
                document.getElementById(
                    "selectedQuantity"
                ).textContent =
                    "Quantità nel carrello: " +
                    remaining;
            }
        }
        /* ==========================
           CARICAMENTO
        ========================== */
        window.addEventListener(
            "load",
            function() {
                const lang =
                    localStorage.getItem(
                        "language"
                    ) || "it";
                const t =
                    typeof translations !== "undefined"
                        ? (
                            translations[lang] ||
                            translations.it
                        )
                        : {};
                document.documentElement.lang =
                    lang;
                /*
                 * INDIETRO
                 */
                if (t.back) {
                    document.getElementById(
                        "back"
                    ).innerHTML =
                        t.back;
                }
                /*
                 * CARRELLO
                 */
                if (t.cart) {
                    document.getElementById(
                        "cartText"
                    ).innerHTML =
                        t.cart;
                }
                /*
                 * VAI AL CARRELLO
                 */
                document.getElementById(
                    "goCart"
                ).innerHTML =
                    t.goCart ||
                    "🛒 Vai al carrello";
                /*
                 * TORNA AI VAPO
                 */
                document.getElementById(
                    "goVape"
                ).innerHTML =
                    "← " +
                    (
                        t.backVape ||
                        "Torna ai VAPO"
                    );
                /*
                 * MENU
                 */
                document.getElementById(
                    "goMenu"
                ).innerHTML =
                    t.goMenu ||
                    "🏠 Torna al menu";
                /*
                 * Mostra carrello
                 */
                showMiniCart();
            }
        );
    </script>
</body>
</html>
