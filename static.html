<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<!-- FONT LUXURY & PREMIUM FROM GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    box-sizing: border-box;

    background: linear-gradient(145deg, rgba(20, 25, 20, 0.95), rgba(10, 15, 10, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.section-title-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    transition: 0.5s;
    animation: shine 6s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;

    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    margin-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 4px;
    width: 60%;
}

.static-folders {
    max-width: 600px;
    margin: 25px auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.static-folder-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    background: rgba(20, 30, 20, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.static-folder-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.4);
}

.static-folder-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.static-folder-arrow {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 800;
}

@media (max-width: 500px) {
    .section-title-text {
        font-size: 22px;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="back-button">
        <a href="shop.html" id="back" data-translate="back">
            ← Indietro
        </a>
    </div>

    <!-- TITOLO STATIC STYLE -->
    <div class="section-title-container">
        <span class="section-title-text">STATIC</span>
        <div class="title-badge">OASIS DEL SUR</div>
    </div>

    <!-- VOCE MOUNTAIN GIANTS -->
    <div class="static-folders">
        <a href="mountain-giants.html" class="static-folder-card">
            <span class="static-folder-title">📁 MOUNTAIN GIANTS</span>
            <span class="static-folder-arrow">›</span>
        </a>
    </div>
</div>

<script>
const translations = {
    it: {
        back: "← Indietro"
    },
    en: {
        back: "← Back"
    },
    es: {
        back: "← Atrás"
    },
    de: {
        back: "← Zurück"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

window.addEventListener("load", translatePage);
window.addEventListener("pageshow", translatePage);
</script>
</body>
</html>
