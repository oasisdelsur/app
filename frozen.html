<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<!-- FONT LUXURY & PREMIUM FROM GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
/* TITOLO ULTRA-PREMIUM FROZEN */
.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    box-sizing: border-box;

    background: linear-gradient(145deg, rgba(20, 25, 20, 0.95), rgba(10, 15, 10, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.section-title-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    transition: 0.5s;
    animation: shine 6s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;

    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    margin-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 4px;
    width: 60%;
}

/* VOCI FROZEN IN STILE NEUTRO / ARGENTO */
.frozen-list {
    max-width: 600px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.frozen-folder-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: #ffffff;
    background: rgba(20, 25, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.frozen-folder-link:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.35);
    background: rgba(28, 34, 28, 0.92);
}

.frozen-folder-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1.5px;
    color: #f0f0f0;
}

.frozen-folder-arrow {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 900;
}

/* CARRELLO INTEGRATO E COMPATTO */
.cart-card {
    max-width: 600px;
    background: rgba(15, 20, 16, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    padding: 20px;
    margin: 25px auto 20px auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
}

.cart-title-custom {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffffff;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
}

#mini-cart {
    font-size: 14px;
    color: #e0e0e0;
    margin-bottom: 16px;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.04);
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.cart-item-row button {
    background: rgba(255, 59, 48, 0.15);
    color: #ff453a;
    border: 1px solid rgba(255, 59, 48, 0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.cart-item-row button:hover {
    background: #ff3b30;
    color: #ffffff;
}

/* BOTTONI AZIONE INTEGRATI */
.cart-actions-integrated {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.btn-action-int {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    padding: 12px 8px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-action-int.primary {
    background: linear-gradient(135deg, #2b302c, #181c19);
    border: 1px solid rgba(255, 255, 255, 0.28);
}

.btn-action-int:hover {
    background: rgba(255, 255, 255, 0.15);
}

@media (max-width: 500px) {
    .section-title-text {
        font-size: 22px;
    }
}
</style>
</head>
<body>

<div class="back-button">
    <a href="shop.html" id="back">
        <span class="back-circle">←</span>
        <span class="back-label" data-translate="backLabel">Indietro</span>
    </a>
</div>

<div class="container">
    <!-- TITOLO FROZEN STYLE -->
    <div class="section-title-container">
        <span class="section-title-text">FROZEN</span>
        <div class="title-badge">OASIS DEL SUR</div>
    </div>

    <!-- VOCI FROZEN -->
    <div class="frozen-list">
        <a href="eggs-120u.html" class="frozen-folder-link">
            <span class="frozen-folder-left">
                <span>📁</span>
                <span>EGGS 120U</span>
            </span>
            <span class="frozen-folder-arrow">›</span>
        </a>

        <a href="frozen-no-farm.html" class="frozen-folder-link">
            <span class="frozen-folder-left">
                <span>📁</span>
                <span>FROZEN NO FARM</span>
            </span>
            <span class="frozen-folder-arrow">›</span>
        </a>
    </div>

    <!-- CARRELLO INTEGRATO E TRADOTTO -->
    <div class="cart-card">
        <div class="cart-title-custom">
            <span data-translate="cartTitle">CARRELLO</span> <span>🛒</span>
        </div>
        <div id="mini-cart">
            <span data-translate="emptyCart">Carrello vuoto</span>
        </div>

        <div class="cart-actions-integrated">
            <a href="shop.html#cart" class="btn-action-int primary" id="goCart">
                <span>🛒</span> <span data-translate="goToCart">Vai al carrello</span>
            </a>
            <a href="shop.html" class="btn-action-int" id="goMenu">
                <span>🏠</span> <span data-translate="backToMenu">Torna al menu</span>
            </a>
        </div>
    </div>
</div>

<script src="language.js"></script>
<script>
const pageTranslations = {
    it: {
        backLabel: "Indietro",
        cartTitle: "CARRELLO",
        emptyCart: "Carrello vuoto",
        goToCart: "Vai al carrello",
        backToMenu: "Torna al menu"
    },
    en: {
        backLabel: "Back",
        cartTitle: "CART",
        emptyCart: "Empty cart",
        goToCart: "Go to cart",
        backToMenu: "Back to menu"
    },
    es: {
        backLabel: "Atrás",
        cartTitle: "CARRITO",
        emptyCart: "Carrito vacío",
        goToCart: "Ir al carrito",
        backToMenu: "Volver al menú"
    },
    de: {
        backLabel: "Zurück",
        cartTitle: "WARENKORB",
        emptyCart: "Warenkorb leer",
        goToCart: "Zum Warenkorb",
        backToMenu: "Zurück zum Menü"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = pageTranslations[lang] || pageTranslations.it;
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function showMiniCart() {
    cart = JSON.parse(localStorage.getItem("cart")) || [];
    const box = document.getElementById("mini-cart");
    if (!box) return;
    const lang = getLanguage();
    const t = pageTranslations[lang] || pageTranslations.it;

    if (cart.length === 0) {
        box.innerHTML = t.emptyCart;
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML += '<div class="cart-item-row"><span>• ' + item + '</span><button onclick="removeItem(' + index + ')">❌ Rimuovi</button></div>';
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
}

window.addEventListener("load", function() {
    translatePage();
    showMiniCart();
});

window.addEventListener("pageshow", function() {
    translatePage();
    showMiniCart();
});
</script>
</body>
</html>
