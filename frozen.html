<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
<style>
.frozen-coming {
    min-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 45px auto;
    position: relative;
    overflow: hidden;
    border-radius: 30px;
    background:
        radial-gradient(
            circle at center,
            rgba(0,255,120,.10),
            transparent 55%
        ),
        rgba(10,10,10,.72);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(0,255,120,.18);
    box-shadow:
        0 0 50px rgba(0,255,120,.08),
        0 20px 60px rgba(0,0,0,.8);
}

.frozen-coming::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(0,255,120,.08);
    filter: blur(70px);
    animation: glow 4s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% {
        transform: scale(.85);
        opacity: .5;
    }
    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

.frozen-content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.frozen-title {
    color: white;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 8px;
    margin: 0;
    text-shadow: 0 0 20px rgba(0,255,120,.18);
}

.frozen-status {
    margin-top: 18px;
    color: rgba(0,255,120,.75);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 4px;
}

.frozen-line {
    width: 90px;
    height: 2px;
    margin: 25px auto;
    background: rgba(0,255,120,.5);
    box-shadow: 0 0 15px rgba(0,255,120,.5);
}

.frozen-message {
    color: rgba(255,255,255,.55);
    font-size: 15px;
    letter-spacing: 1px;
}

@media (max-width: 500px) {
    .frozen-coming {
        min-height: 380px;
        margin: 30px auto;
    }
    .frozen-title {
        font-size: 40px;
        letter-spacing: 6px;
    }
    .frozen-status {
        font-size: 11px;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="section-title" id="frozenTitle" data-translate="frozen">
        ❄️ FROZEN
    </div>

    <div class="back-button">
        <a href="shop.html" id="back" data-translate="back">
            ← Indietro
        </a>
    </div>

    <div class="frozen-coming">
        <div class="frozen-content">
            <h1 class="frozen-title">
                FROZEN
            </h1>
            <div class="frozen-status">
                COMING SOON
            </div>
            <div class="frozen-line"></div>
            <div class="frozen-message" data-translate="comingSoonMsg">
                La selezione sta arrivando.
            </div>
        </div>
    </div>
</div>

<script>
const translations = {
    it: {
        frozen: "❄️ FROZEN",
        back: "← Indietro",
        comingSoonMsg: "La selezione sta arrivando."
    },
    en: {
        frozen: "❄️ FROZEN",
        back: "← Back",
        comingSoonMsg: "The selection is coming soon."
    },
    es: {
        frozen: "❄️ FROZEN",
        back: "← Atrás",
        comingSoonMsg: "La selección está arrivando."
    },
    de: {
        frozen: "❄️ FROZEN",
        back: "← Zurück",
        comingSoonMsg: "Die Auswahl kommt bald."
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;
    
    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

translatePage();
</script>
</body>
</html>
