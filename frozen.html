<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<!-- FONT LUXURY & PREMIUM FROM GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
/* TITOLO ULTRA-PREMIUM FROZEN */
.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    box-sizing: border-box;

    background: linear-gradient(145deg, rgba(20, 25, 20, 0.95), rgba(10, 15, 10, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.section-title-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    transition: 0.5s;
    animation: shine 6s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;

    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    margin-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 4px;
    width: 60%;
}

/* LISTA VOCI FROZEN */
.frozen-list {
    max-width: 600px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.frozen-folder-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: #ffffff;
    background: rgba(15, 25, 18, 0.9);
    border: 1px solid rgba(76, 175, 80, 0.35);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.frozen-folder-link:hover {
    transform: translateY(-2px);
    border-color: rgba(76, 175, 80, 0.7);
}

.frozen-folder-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
}

.frozen-folder-arrow {
    font-size: 18px;
    color: #4CAF50;
    font-weight: 900;
}

/* CARRELLO INTEGRATO E COMPATTO */
.cart-card {
    max-width: 600px;
    background: rgba(10, 20, 12, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(50, 205, 50, 0.3);
    border-radius: 22px;
    padding: 20px;
    margin: 25px auto 20px auto;
    box-shadow: 0 0 20px rgba(50, 205, 50, 0.15), inset 0 0 15px rgba(50, 205, 50, 0.05);
}

.cart-title-custom {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #4CAF50;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
}

#mini-cart {
    font-size: 14px;
    color: #e0e0e0;
    margin-bottom: 16px;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.04);
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.cart-item-row button {
    background: rgba(255, 59, 48, 0.15);
    color: #ff453a;
    border: 1px solid rgba(255, 59, 48, 0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}
