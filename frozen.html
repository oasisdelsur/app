<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<!-- FONT LUXURY & PREMIUM FROM GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
/* SCHEDE CARTELLE FROZEN */
.frozen-folders {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 25px 0;
}

.frozen-folder-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    background: rgba(20, 30, 20, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.frozen-folder-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.4);
}

.frozen-folder-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.frozen-folder-arrow {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 800;
}

/* CARRELLO INTEGRATO E COMPATTO */
.cart-card {
    background: rgba(10, 20, 12, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(50, 205, 50, 0.3);
    border-radius: 22px;
    padding: 20px;
    margin: 25px 0 20px 0;
    box-shadow: 0 0 20px rgba(50, 205, 50, 0.15), inset 0 0 15px rgba(50, 205, 50, 0.05);
}

.cart-title-custom {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #4CAF50;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
}

#mini-cart {
    font-size: 14px;
    color: #e0e0e0;
    margin-bottom: 16px;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.04);
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.cart-item-row button {
    background: rgba(255, 59, 48, 0.15);
    color: #ff453a;
    border: 1px solid rgba(255, 59, 48, 0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.cart-item-row button:hover {
    background: #ff3b30;
    color: #ffffff;
}

/* BOTTONI AZIONE INTEGRATI */
.cart-actions-integrated {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.btn-action-int {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 12px 8px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-action-int.primary {
    background: linear-gradient(135deg, #1e7e34, #155724);
    border: 1px solid rgba(76, 175, 80, 0.5);
    box-shadow: 0 4px 12px rgba(40, 167, 69, 0.25);
}

.btn-action-int:hover {
    background: rgba(255, 255, 255, 0.15);
}

.btn-action-int.primary:hover {
    background: linear-gradient(135deg, #28a745, #1e7e34);
}
</style>
</head>
<body>

<div class="container">
    <div class="back-button">
        <a href="shop.html" id="back" data-translate="back">
            ← Indietro
        </a>
    </div>

    <!-- VOCI FROZEN -->
    <div class="frozen-folders">
        <a href="eggs-120u.html" class="frozen-folder-card">
            <span class="frozen-folder-title">📁 EGGS 120U</span>
            <span class="frozen-folder-arrow">›</span>
        </a>
        <a href="frozen-no-farm.html" class="frozen-folder-card">
            <span class="frozen-folder-title">📁 FROZEN NO FARM</span>
            <span class="frozen-folder-arrow">›</span>
        </a>
    </div>

    <!-- CARRELLO INTEGRATO E TRADOTTO -->
    <div class="cart-card">
        <div class="cart-title-custom">
            <span data-translate="cartTitle">CARRELLO</span> <span>🛒</span>
        </div>
        <div id="mini-cart">
            <span data-translate="emptyCart">Carrello vuoto</span>
        </div>

        <div class="cart-actions-integrated">
            <a href="shop.html#cart" class="btn-action-int primary" id="goCart">
                <span>🛒</span> <span data-translate="goToCart">Vai al carrello</span>
            </a>
            <a href="shop.html" class="btn-action-int" id="goMenu">
                <span>🏠</span> <span data-translate="backToMenu">Torna al menu</span>
            </a>
        </div>
    </div>
</div>

<script>
/* TRADUZIONI INTEGRATE */
const translations = {
    it: {
        back: "← Indietro",
        cartTitle: "CARRELLO",
        emptyCart: "Carrello vuoto",
        goToCart: "Vai al carrello",
        backToMenu: "Torna al menu"
    },
    en: {
        back: "← Back",
        cartTitle: "CART",
        emptyCart: "Empty cart",
        goToCart: "Go to cart",
        backToMenu: "Back to menu"
    },
    es: {
        back: "← Atrás",
        cartTitle: "CARRITO",
        emptyCart: "Carrito vacío",
        goToCart: "Ir al carrito",
        backToMenu: "Volver al menú"
    },
    de: {
        back: "← Zurück",
        cartTitle: "WARENKORB",
        emptyCart: "Warenkorb leer",
        goToCart: "Zum Warenkorb",
        backToMenu: "Zurück zum Menü"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;
    
    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

/* GESTIONE CARRELLO */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function showMiniCart() {
    const box = document.getElementById("mini-cart");
    if (!box) return;
    const lang = getLanguage();
    const t = translations[lang] || translations.it;
    
    if (cart.length === 0) {
        box.innerHTML = t.emptyCart;
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML += '<div class="cart-item-row"><span>• ' + item + '</span><button onclick="removeItem(' + index + ')">❌ Rimuovi</button></div>';
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
}

window.addEventListener("load", function() {
    translatePage();
    showMiniCart();
});
</script>
</body>
</html>
