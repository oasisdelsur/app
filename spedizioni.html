<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Spedizioni - Oasis del Sur</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
    <style>
        .order-recap {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            margin: 12px 0 18px 0;
            text-align: left;
        }
        .order-recap-title {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .shipping-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
            text-align: left;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .field-group label {
            font-size: 14px;
            font-weight: 600;
        }
        .field-row {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 10px;
        }
        .shipping-form input,
        .shipping-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(0, 0, 0, 0.28);
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
        }
        .shipping-form input::placeholder,
        .shipping-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }
        .shipping-form input:focus,
        .shipping-form textarea:focus {
            outline: none;
            border-color: #e11d2e;
        }
        .shipping-form textarea {
            min-height: 70px;
            resize: vertical;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- FRECCIA -->
    <div class="back-button">
        <a href="shop.html">
            <span class="back-circle">←</span>
            <span class="back-label" data-translate="backShop">TORNA ALLO SHOP</span>
        </a>
    </div>

    <div class="cart">
        <div class="cart-title" data-translate="shippingTitle">
            📦 Spedizione e Ordine
        </div>

        <!-- RIEPILOGO CARRELLO COLLEGATO -->
        <div class="order-recap">
            <div class="order-recap-title" data-translate="recapTitle">
                🛒 Il tuo ordine attuale:
            </div>
            <div id="cartRecap">
                <span data-translate="emptyCart">Nessun prodotto</span>
            </div>
        </div>

        <form id="shippingForm" class="shipping-form" onsubmit="goToBitcoinOrder(event)">
            <div class="field-group">
                <label for="fullName" data-translate="labelName">Nome e Cognome *</label>
                <input
                    type="text"
                    id="fullName"
                    required
                    placeholder="Es. Marco Rossi"
                >
            </div>

            <div class="field-group">
                <label for="address" data-translate="labelAddress">Indirizzo (Via / Piazza e N°) *</label>
                <input
                    type="text"
                    id="address"
                    required
                    placeholder="Es. Via Roma 12"
                >
            </div>

            <div class="field-row">
                <div class="field-group">
                    <label for="zip" data-translate="labelZip">CAP *</label>
                    <input
                        type="text"
                        id="zip"
                        required
                        placeholder="00100"
                    >
                </div>

                <div class="field-group">
                    <label for="city" data-translate="labelCity">Città *</label>
                    <input
                        type="text"
                        id="city"
                        required
                        placeholder="Es. Roma"
                    >
                </div>
            </div>

            <div class="field-group">
                <label for="country" data-translate="labelCountry">Paese *</label>
                <input
                    type="text"
                    id="country"
                    required
                    value="Italia"
                >
            </div>

            <div class="field-group">
                <label for="notes" data-translate="labelNotes">Note (opzionale)</label>
                <textarea
                    id="notes"
                    placeholder="Citofono, scala, orari o altre info..."
                ></textarea>
            </div>

            <button
                type="submit"
                class="checkout"
                data-translate="payBitcoinButton"
            >
                ₿ Paga in Bitcoin e invia ordine
            </button>
        </form>
    </div>
</div>

<script>
const translations = {
    it: {
        backShop: "TORNA ALLO SHOP",
        shippingTitle: "📦 Spedizione e Ordine",
        recapTitle: "🛒 Il tuo ordine attuale:",
        emptyCart: "Nessun prodotto nel carrello",
        labelName: "Nome e Cognome *",
        labelAddress: "Indirizzo (Via / Piazza e N°) *",
        labelZip: "CAP *",
        labelCity: "Città *",
        labelCountry: "Paese *",
        labelNotes: "Note (opzionale)",
        payBitcoinButton: "₿ Paga in Bitcoin e invia ordine",
        alertMissing: "Compila tutti i campi obbligatori (*).",
        alertEmptyCart: "Il carrello è vuoto! Aggiungi prima i prodotti dallo shop."
    },
    en: {
        backShop: "BACK TO SHOP",
        shippingTitle: "📦 Shipping & Order",
        recapTitle: "🛒 Your current order:",
        emptyCart: "No products in cart",
        labelName: "Full Name *",
        labelAddress: "Street Address & Number *",
        labelZip: "ZIP / Postal Code *",
        labelCity: "City *",
        labelCountry: "Country *",
        labelNotes: "Notes (optional)",
        payBitcoinButton: "₿ Pay with Bitcoin & send order",
        alertMissing: "Please fill in all required fields (*).",
        alertEmptyCart: "Your cart is empty! Add products from the shop first."
    },
    es: {
        backShop: "VOLVER A LA TIENDA",
        shippingTitle: "📦 Envío y Pedido",
        recapTitle: "🛒 Tu pedido actual:",
        emptyCart: "Ningún producto en el carrito",
        labelName: "Nombre y Apellidos *",
        labelAddress: "Dirección y Número *",
        labelZip: "Código Postal *",
        labelCity: "Ciudad *",
        labelCountry: "País *",
        labelNotes: "Notas (opcional)",
        payBitcoinButton: "₿ Pagar con Bitcoin y enviar pedido",
        alertMissing: "Completa todos los campos obligatorios (*).",
        alertEmptyCart: "¡El carrito está vacío! Añade productos desde la tienda primero."
    },
    de: {
        backShop: "ZURÜCK ZUM SHOP",
        shippingTitle: "📦 Versand & Bestellung",
        recapTitle: "🛒 Deine aktuelle Bestellung:",
        emptyCart: "Keine Produkte im Warenkorb",
        labelName: "Vor- und Nachname *",
        labelAddress: "Straße und Hausnummer *",
        labelZip: "PLZ *",
        labelCity: "Stadt *",
        labelCountry: "Land *",
        labelNotes: "Hinweise (optional)",
        payBitcoinButton: "₿ Mit Bitcoin bezahlen & Bestellung senden",
        alertMissing: "Bitte fülle alle Pflichtfelder (*) aus.",
        alertEmptyCart: "Der Warenkorb ist leer! Füge zuerst Produkte im Shop hinzu."
    }
};

function getLanguage() {
    const saved = localStorage.getItem("language") || "it";
    return translations[saved] ? saved : "it";
}

function translatePage() {
    const language = getLanguage();
    const texts = translations[language];
    document.documentElement.lang = language;

    document.querySelectorAll("[data-translate]").forEach(function(element) {
        const key = element.getAttribute("data-translate");
        if (texts[key]) {
            element.textContent = texts[key];
        }
    });
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let stickers = JSON.parse(localStorage.getItem("stickers")) || [];
let gadgets = JSON.parse(localStorage.getItem("gadgets")) || [];

function groupItems(arr) {
    const grouped = {};
    arr.forEach(item => {
        grouped[item] = (grouped[item] || 0) + 1;
    });
    return grouped;
}

function showCartRecap() {
    const box = document.getElementById("cartRecap");
    if (cart.length === 0 && stickers.length === 0 && gadgets.length === 0) {
        box.innerHTML = translations[getLanguage()].emptyCart;
        return;
    }

    const grouped = groupItems(cart);
    const groupedStickers = groupItems(stickers);
    const groupedGadgets = groupItems(gadgets);

    box.innerHTML = "";

    Object.keys(grouped).forEach(product => {
        box.innerHTML += "• " + product + " × " + grouped[product] +
            ' <button type="button" onclick="removeOne(\'cart\', \'' + product.replace(/'/g, "\\'") + '\')">❌</button><br>';
    });

    Object.keys(groupedStickers).forEach(sticker => {
        box.innerHTML += "• [STATIC] " + sticker + " × " + groupedStickers[sticker] +
            ' <button type="button" onclick="removeOne(\'stickers\', \'' + sticker.replace(/'/g, "\\'") + '\')">❌</button><br>';
    });

    Object.keys(groupedGadgets).forEach(gadget => {
        box.innerHTML += "• [GADGET] " + gadget + " × " + groupedGadgets[gadget] +
            ' <button type="button" onclick="removeOne(\'gadgets\', \'' + gadget.replace(/'/g, "\\'") + '\')">❌</button><br>';
    });
}

function removeOne(type, name) {
    if (type === "cart") {
        const idx = cart.lastIndexOf(name);
        if (idx !== -1) cart.splice(idx, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
    } else if (type === "stickers") {
        const idx = stickers.lastIndexOf(name);
        if (idx !== -1) stickers.splice(idx, 1);
        localStorage.setItem("stickers", JSON.stringify(stickers));
    } else if (type === "gadgets") {
        const idx = gadgets.lastIndexOf(name);
        if (idx !== -1) gadgets.splice(idx, 1);
        localStorage.setItem("gadgets", JSON.stringify(gadgets));
    }
    showCartRecap();
}

function goToBitcoinOrder(event) {
    event.preventDefault();
    const lang = getLanguage();

    if (cart.length === 0 && stickers.length === 0 && gadgets.length === 0) {
        alert(translations[lang].alertEmptyCart);
        return;
    }

    const fullName = document.getElementById("fullName").value.trim();
    const address = document.getElementById("address").value.trim();
    const zip = document.getElementById("zip").value.trim();
    const city = document.getElementById("city").value.trim();
    const country = document.getElementById("country").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!fullName || !address || !zip || !city || !country) {
        alert(translations[lang].alertMissing);
        return;
    }

    localStorage.setItem("shippingData", JSON.stringify({
        fullName, address, zip, city, country, notes
    }));

    window.location.href = "bitcoin.html";
}

window.addEventListener("load", function() {
    translatePage();
    showCartRecap();
});
</script>
</body>
</html>
