<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARAMELLE FAT TONY - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 14px 40px 14px;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
}

.top-back {
    max-width: 600px;
    margin: 0 auto 14px auto;
}

.top-back a {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(15, 25, 18, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    font-size: 13px;
}

.wrap {
    max-width: 600px;
    margin: 0 auto;
}

.title-box {
    text-align: center;
    padding: 18px;
    margin-bottom: 20px;
    border-radius: 18px;
    background: #14120b;
    border: 1px solid rgba(255, 215, 0, 0.45);
}

.title-main {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 2px;
}

.title-sub {
    font-size: 11px;
    font-weight: 800;
    color: #ffd700;
    letter-spacing: 2px;
    margin-top: 6px;
}

.media-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 22px;
}

.photo-card {
    background: #101612;
    border: 1px solid rgba(76, 175, 80, 0.35);
    border-radius: 18px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.media-item,
.video-item {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 14px;
    display: block;
    background: #000000;
}

.video-label {
    margin-top: 10px;
    padding: 9px 8px;
    border-radius: 12px;
    background: #172b1b;
    border: 1px solid rgba(76, 175, 80, 0.35);
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.5px;
}

.sizes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
}

.sizes-grid button {
    padding: 8px 4px;
    border-radius: 10px;
    border: 1px solid rgba(76, 175, 80, 0.5);
    background: #172b1b;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 11px;
    cursor: pointer;
}

.sizes-grid button:active {
    background: #2e7d32;
}

.cart-box {
    background: #101812;
    border: 1px solid rgba(76, 175, 80, 0.4);
    border-radius: 20px;
    padding: 18px;
    margin-top: 24px;
}

.cart-head {
    font-size: 15px;
    font-weight: 900;
    color: #4ade80;
    margin-bottom: 12px;
}

.cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
}

.cart-row button {
    background: #dc2626;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.cart-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.cart-actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 12px 10px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    color: #ffffff;
    background: #1f2937;
}

.cart-actions a.go-cart {
    background: #1b5e20;
}

@media (max-width: 500px) {
    .media-item,
    .video-item {
        height: 160px;
    }
    .sizes-grid button {
        font-size: 10px;
        padding: 7px 2px;
    }
}
</style>
</head>
