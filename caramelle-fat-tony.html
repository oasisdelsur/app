.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    box-sizing: border-box;
    background: linear-gradient(145deg, rgba(25, 20, 10, 0.9), rgba(15, 15, 8, 0.95));
    border: 1px solid rgba(255, 215, 0, 0.4);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.section-title-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.15), transparent);
    transition: 0.5s;
    animation: shine 6s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

.title-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, #ffd700 40%, #ffae00 70%, #ff8c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.5));
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #ffd700;
    text-transform: uppercase;
    margin-top: 6px;
    border-top: 1px solid rgba(255, 215, 0, 0.3);
    padding-top: 4px;
    width: 60%;
    text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
}

.photo-block {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 24px auto;
    padding: 12px;
    box-sizing: border-box;
    border-radius: 20px;
    background: rgba(15, 22, 16, 0.78);
    border: 1px solid rgba(76, 175, 80, 0.25);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}

.product-image, .product-video {
    width: 100%;
    max-width: 600px;
    height: 350px;
    display: block;
    margin: 0 auto;
    border-radius: 16px;
    object-fit: cover;
    object-position: center;
}

.product-video {
    margin-bottom: 20px;
}

.photo-sizes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.photo-sizes button {
    background: rgba(15, 30, 18, 0.9);
    border: 1px solid rgba(76, 175, 80, 0.45);
    border-radius: 12px;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 800;
    padding: 11px 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
}

.photo-sizes button:hover, .photo-sizes button:active {
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    border-color: #66bb6a;
    transform: translateY(-2px);
    box-shadow: 0 0 12px rgba(76, 175, 80, 0.4);
}

    border-radius: 22px;
    padding: 20px;
    margin: 25px 0 20px 0;
    box-shadow: 0 0 20px rgba(50, 205, 50, 0.15), inset 0 0 15px rgba(50, 205, 50, 0.05);
}

}

    background: #ff3b30;

}
