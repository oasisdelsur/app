<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 75px 16px 40px 16px;
    background: #070908;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
}

.back-arrow-fixed {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(15, 18, 16, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 22px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
}

.btc-wrapper {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.btc-header {
    text-align: center;
    padding: 18px;
    border-radius: 20px;
    background: linear-gradient(145deg, rgba(28, 22, 8, 0.92), rgba(12, 14, 13, 0.96));
    border: 1px solid rgba(247, 147, 26, 0.45);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
}

.btc-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #f7931a;
    margin: 0 0 6px 0;
}

.btc-sub {
    font-size: 12px;
    color: #cccccc;
    margin: 0;
}

.btc-card {
    background: rgba(15, 18, 16, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
}

.qr-box-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}
