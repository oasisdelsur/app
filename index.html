<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oasis del Sur</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
}

/* LOGO */

.logo-box{
    height:230px;
    background:#181818;
    border-radius:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:220px;
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto 15px auto;
}

/* CATEGORIE */

.category{
    background:#1f1f1f;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    font-size:22px;
    text-align:center;
    cursor:pointer;
}

/* PRODOTTI */

.products{
    display:none;
    margin-top:15px;
}

.product{
    background:#303030;
    padding:15px;
    border-radius:15px;
    margin:10px 0;
    font-size:16px;
    cursor:pointer;
}

/* CARRELLO */

.cart{
    background:#181818;
    border-radius:20px;
    padding:20px;
    margin-top:30px;
}

</style>

</head>

<body>

<div class="container">

<!-- LOGO -->

<div class="logo-box">
    <div>
        <img src="IMG_9609.png" alt="Oasis del Sur" class="logo">
        <p>Premium Experience</p>
    </div>
</div>

<!-- WEED -->

<div class="category" onclick="openCategory('weed')">

🌿 Weed

<div id="weed" class="products">

<div class="product" onclick="addCart('Weed prodotto 1')">
Prodotto 1
</div>

<div class="product" onclick="addCart('Weed prodotto 2')">
Prodotto 2
</div>

<div class="product" onclick="addCart('Weed prodotto 3')">
Prodotto 3
</div>

</div>

</div>

<!-- FROZEN -->

<div class="category" onclick="openCategory('frozen')">

❄️ Frozen / Static

<div id="frozen" class="products">

<div class="product" onclick="addCart('Frozen prodotto 1')">
Prodotto 1
</div>

<div class="product" onclick="addCart('Frozen prodotto 2')">
Prodotto 2
</div>

<div class="product" onclick="addCart('Frozen prodotto 3')">
Prodotto 3
</div>

</div>

</div>

<!-- DRY -->

<div class="category" onclick="openCategory('dry')">

🌱 Dry

<div id="dry" class="products">

<div class="product" onclick="addCart('Dry prodotto 1')">
Prodotto 1
</div>

<div class="product" onclick="addCart('Dry prodotto 2')">
Prodotto 2
</div>

<div class="product" onclick="addCart('Dry prodotto 3')">
Prodotto 3
</div>

</div>

</div>

<!-- EXTRACT -->

<div class="category" onclick="openCategory('extract')">

💎 Extract

<div id="extract" class="products">

<div class="product" onclick="addCart('Extract prodotto 1')">
Prodotto 1
</div>

<div class="product" onclick="addCart('Extract prodotto 2')">
Prodotto 2
</div>

<div class="product" onclick="addCart('Extract prodotto 3')">
Prodotto 3
</div>

</div>

</div>

<!-- CARRELLO -->

<div class="cart">

<h3>🛒 Carrello</h3>

<div id="cart">
Nessun prodotto
</div>

</div>

</div>

<script>

let cart=[];

function openCategory(id){

let box=document.getElementById(id);

if(box.style.display==="block"){
    box.style.display="none";
}else{
    box.style.display="block";
}

}

function addCart(product){

cart.push(product);

document.getElementById("cart").innerHTML =
cart.join("<br>");

}

</script>

</body>

</html>
