<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oasis del Sur</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* LOGO OTTIMIZZATO E FLUIDO */
        .logo-container {
            width: 140px;
            height: 140px;
            margin-bottom: 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* GRIGLIA LINGUE COMODA E TOCCABILE */
        .languages {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .language {
            background: #121212;
            color: #b0b0b0;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .language:active {
            transform: scale(0.96);
        }

        .language.selected {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.08);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.15);
        }

        /* TITOLO PULITO */
        h1 {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 32px;
            color: #f5f5f5;
        }

        /* PULSANTE PRINCIPALE */
        .enter {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #00e676;
            color: #000000;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
            transition: all 0.2s ease;
        }

        .enter:active {
            transform: scale(0.98);
            background: #00c853;
        }
    </style>
</head>
<body>
    <div class="welcome">
        <!-- LOGO -->
        <div class="logo-container">
            <img src="IMG_9609.png" class="logo" alt="Oasis del Sur">
        </div>
        
        <!-- LINGUE -->
        <div class="languages">
            <button type="button" class="language" data-lang="it" onclick="selectLanguage('it')">🇮🇹 Italiano</button>
            <button type="button" class="language" data-lang="en" onclick="selectLanguage('en')">🇬🇧 English</button>
            <button type="button" class="language" data-lang="es" onclick="selectLanguage('es')">🇪🇸 Español</button>
            <button type="button" class="language" data-lang="de" onclick="selectLanguage('de')">🇩🇪 Deutsch</button>
        </div>
        
        <!-- TESTO DI BENVENUTO -->
        <h1 id="welcomeText">Benvenuto in Oasis del Sur</h1>
        
        <!-- ENTRA -->
        <a href="shop.html" class="enter" id="enterButton">ENTRA</a>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const translations = {
            it: { welcome: "Benvenuto in Oasis del Sur", enter: "ENTRA" },
            en: { welcome: "Welcome to Oasis del Sur", enter: "ENTER" },
            es: { welcome: "Bienvenido a Oasis del Sur", enter: "ENTRAR" },
            de: { welcome: "Willkommen bei Oasis del Sur", enter: "EINTRETEN" }
        };

        function selectLanguage(language) {
            localStorage.setItem("language", language);
            document.documentElement.lang = language;
            document.getElementById("welcomeText").textContent = translations[language].welcome;
            document.getElementById("enterButton").textContent = translations[language].enter;
            
            document.querySelectorAll(".language").forEach(btn => {
                btn.classList.toggle("selected", btn.dataset.lang === language);
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedLanguage = localStorage.getItem("language") || "it";
            selectLanguage(savedLanguage);
        });
    </script>
</body>
</html>
