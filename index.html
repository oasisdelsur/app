<body>


<div class="container">

</div>



<div class="section-header">


<div class="section-title" id="dispensario">

</div>



<div class="language-box">


<button class="language-button" onclick="openLanguage()">

🌐 Language ▾

</button>


<div class="language-menu" id="languageMenu">


<button onclick="changeLanguage('it')">🇮🇹 Italiano</button>

<button onclick="changeLanguage('es')">🇪🇸 Español</button>

<button onclick="changeLanguage('en')">🇬🇧 English</button>

<button onclick="changeLanguage('de')">🇩🇪 Deutsch</button>


</div>


</div>


</div>





<a href="weed.html" class="category-link">

<div class="category">

<img src="a82ad9_3bc1726cb8bd4951bf8e445cf043f960~mv2.avif" class="category-image">

<div class="category-name" id="weed">

Weed

</div>

</div>

</a>





<a href="frozen.html" class="category-link">

<div class="category">

<img src="frozen.jpg" class="category-image">

<div class="category-name" id="frozen">

Frozen

</div>

</div>

<a href="dry.html" class="category-link">

<div class="category">

</div>

Extract

</div>

</div>

</a>



</div>






<div class="cart">


<div class="cart-title" id="cartTitle">

🛒 Carrello

</div>



<div id="cart">

Nessun prodotto

</div>



<button class="checkout" onclick="sendOrder()" id="orderButton">

📲 Conferma ordine

</button>


</div>






<script src="language.js"></script>


<script>


function openLanguage(){

let menu=document.getElementById("languageMenu");

menu.classList.toggle("show");

}





function changeLanguage(lang){


localStorage.setItem("language",lang);


let t=translations[lang];



document.getElementById("dispensario").innerHTML=t.dispensario;

document.getElementById("weed").innerHTML=t.weed;

document.getElementById("frozen").innerHTML=t.frozen;

document.getElementById("dry").innerHTML=t.dry;

document.getElementById("extract").innerHTML=t.extract;

document.getElementById("cartTitle").innerHTML=t.cart;

document.getElementById("orderButton").innerHTML=t.order;



document.documentElement.lang=lang;


document.getElementById("languageMenu").classList.remove("show");


}







let cart = JSON.parse(localStorage.getItem("cart")) || [];



function showCart(){


let box=document.getElementById("cart");



if(cart.length===0){

box.innerHTML="Nessun prodotto";

return;

}



box.innerHTML="";



cart.forEach((item,index)=>{


box.innerHTML += item +

' <button onclick="removeItem('+index+')">❌</button><br><br>';


});


}




function removeItem(index){


cart.splice(index,1);


localStorage.setItem("cart",JSON.stringify(cart));


showCart();


}





function sendOrder(){


if(cart.length===0){

alert("Il carrello è vuoto");

return;

}


let ordine=cart.join("\n");


let messaggio="Ciao Oasis del Sur, vorrei ordinare:\n\n"+ordine;


let telegram="https://t.me/wordex17?text="+encodeURIComponent(messaggio);


window.location.href=telegram;


}





window.onload=function(){


showCart();



let saved=localStorage.getItem("language");


if(saved){

changeLanguage(saved);

}


}



</script>



</body>

</html>
