<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis del Sur</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome {
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
        }
        .logo-container {
            width: 280px;
            height: 280px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }
        /* LINGUE */
        .languages {
            width: 230px;
            margin: 0 auto 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .language {
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 9px 6px;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .language:hover {
            background: #222;
            transform: scale(1.03);
        }
        .language.selected {
            border-color: #00e676;
            background: #181818;
        }
        h1 {
            margin: 0 0 30px;
            font-size: 32px;
            line-height: 1.2;
        }
        .enter {
            display: inline-block;
            background: #00e676;
            color: #000;
            text-decoration: none;
            padding: 16px 60px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s ease;
        }
        .enter:hover {
            background: #00ff88;
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            .welcome {
                padding: 20px 15px;
            }
            .logo-container {
                width: 280px;
                height: 280px;
                max-width: 70vw;
                max-height: 70vw;
                margin-bottom: 15px;
            }
            .languages {
                width: 220px;
                gap: 6px;
                margin-bottom: 18px;
            }
            .language {
                padding: 9px 4px;
                font-size: 13px;
            }
            h1 {
                font-size: 26px;
                margin-bottom: 25px;
            }
            .enter {
                padding: 14px 50px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome">
        <!-- LOGO -->
        <div class="logo-container">
            <img
                src="IMG_9609.png"
                class="logo"
                alt="Oasis del Sur"
            >
        </div>
        <!-- LINGUE -->
        <div class="languages">
            <button
                class="language selected"
                onclick="selectLanguage('it')"
            >
                🇮🇹 Italiano
            </button>
            <button
                class="language"
                onclick="selectLanguage('en')"
            >
                🇬🇧 English
            </button>
            <button
                class="language"
                onclick="selectLanguage('es')"
            >
                🇪🇸 Español
            </button>
            <button
                class="language"
                onclick="selectLanguage('de')"
            >
                🇩🇪 Deutsch
            </button>
        </div>
        <!-- BENVENUTO -->
        <h1 id="welcomeText">
            Benvenuto in Oasis del Sur
        </h1>
        <!-- ENTRA -->
        <a
            href="shop.html"
            class="enter"
            id="enterButton"
        >
            ENTRA
        </a>
    </div>
    <script>
        const translations = {
            it: {
                welcome: "Benvenuto in Oasis del Sur",
                enter: "ENTRA"
            },
            en: {
                welcome: "Welcome to Oasis del Sur",
                enter: "ENTER"
            },
            es: {
                welcome: "Bienvenido a Oasis del Sur",
                enter: "ENTRAR"
            },
            de: {
                welcome: "Willkommen bei Oasis del Sur",
                enter: "EINTRETEN"
            }
        };
        function selectLanguage(language) {
            localStorage.setItem(
                "language",
                language
            );
            document.documentElement.lang =
                language;
            document.getElementById(
                "welcomeText"
            ).textContent =
                translations[language].welcome;
            document.getElementById(
                "enterButton"
            ).textContent =
                translations[language].enter;
            document.querySelectorAll(
                ".language"
            ).forEach(function(button) {
                button.classList.remove(
                    "selected"
                );
            });
            const buttons =
                document.querySelectorAll(
                    ".language"
                );
            const languageIndex = {
                it: 0,
                en: 1,
                es: 2,
                de: 3
            };
            buttons[
                languageIndex[language]
            ].classList.add(
                "selected"
            );
        }
        window.addEventListener(
            "load",
            function() {
                const savedLanguage =
                    localStorage.getItem(
                        "language"
                    ) || "it";
                selectLanguage(
                    savedLanguage
                );
            }
        );
    </script>
</body>
</html>
