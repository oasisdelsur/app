<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oasis del Sur</title>

<style>

body{
    background:#0b0b0b;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}


/* LOGO */

.logo{
    height:230px;
    background:#181818;
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    margin-bottom:25px;
}


/* CATEGORIE */

.category{
    background:#1f1f1f;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    font-size:22px;
    cursor:pointer;
}


/* PRODOTTI */

.products{
    display:none;
    margin-top:15px;
}


.product{
    background:#303030;
    padding:15px;
    border-radius:15px;
    margin:8px 0;
    cursor:pointer;
}


.product:hover{
    background:#444;
}


/* CARRELLO */

.cart{
    margin-top:30px;
    background:#181818;
    padding:20px;
    border-radius:20px;
}


button{
    width:100%;
    padding:15px;
    border-radius:15px;
    border:0;
    font-size:18px;
}


</style>

</head>


<body>


<div class="container">


<div class="logo">

<div>

<h1>🌴</h1>
<h2>Oasis del Sur</h2>

</div>

</div>



<div class="category" onclick="openBox('cat1')">

🌿 Categoria 1

<div class="products" id="cat1">

<div class="product" onclick="addCart('Prodotto 1')">
Prodotto 1
</div>

<div class="product" onclick="addCart('Prodotto 2')">
Prodotto 2
</div>

<div class="product" onclick="addCart('Prodotto 3')">
Prodotto 3
</div>

</div>

</div>




<div class="category" onclick="openBox('cat2')">

❄️ Categoria 2

<div class="products" id="cat2">

<div class="product" onclick="addCart('Prodotto 4')">
Prodotto 4
</div>

<div class="product" onclick="addCart('Prodotto 5')">
Prodotto 5
</div>

<div class="product" onclick="addCart('Prodotto 6')">
Prodotto 6
</div>

</div>

</div>




<div class="cart">

<h3>🛒 Carrello</h3>

<div id="cart">
Vuoto
</div>

<br>

<button>
Invia ordine
</button>

</div>



</div>



<script>

let cart=[];


function openBox(id){

let box=document.getElementById(id);

if(box.style.display=="block"){
box.style.display="none";
}
else{
box.style.display="block";
}

}



function addCart(product){

cart.push(product);

document.getElementById("cart").innerHTML =
cart.join("<br>");

}


</script>



</body>
</html>
