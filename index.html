<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ==========================
     PAGINA DI BENVENUTO
========================== -->
<div id="welcomeScreen" class="welcome-screen">
<div class="welcome-box">
    <img
        src="IMG_9609.png"
        alt="Oasis del Sur"
        class="welcome-logo"
    >
    <h1>OASIS DEL SUR</h1>
    <p id="welcomeText">
        Benvenuto
    </p>
    <div class="welcome-languages">
        <button
            onclick="selectWelcomeLanguage('it')"
            id="lang-it"
        >
            🇮🇹 Italiano
        </button>
        <button
            onclick="selectWelcomeLanguage('es')"
            id="lang-es"
        >
            🇪🇸 Español
        </button>
        <button
            onclick="selectWelcomeLanguage('en')"
            id="lang-en"
        >
            🇬🇧 English
        </button>
        <button
            onclick="selectWelcomeLanguage('de')"
            id="lang-de"
        >
            🇩🇪 Deutsch
        </button>
    </div>
    <button
        class="enter-button"
        onclick="enterSite()"
        id="enterButton"
    >
        ENTRA
    </button>
</div>
</div>
<!-- ==========================
     SITO PRINCIPALE
========================== -->
<div class="container">
<div class="header">
    <img
        src="IMG_9609.png"
        alt="Oasis del Sur"
        class="logo"
    >
</div>
<div class="section-header">
    <div
        class="section-title"
        id="dispensario"
    >
        🌿 Dispensario
    </div>
</div>
<a
    href="weed.html"
    class="category-link"
>
    <div class="category">
        <img
            src="a82ad9_3bc1726cb8bd4951bf8e445cf043f960~mv2.avif"
            class="category-image"
        >
        <div
            class="category-name"
            id="weed"
        >
            Weed
        </div>
    </div>
</a>
<a
    href="frozen.html"
    class="category-link"
>
    <div class="category">
        <img
            src="frozen.jpg"
            class="category-image"
        >
        <div
            class="category-name"
            id="frozen"
        >
            Frozen
        </div>
    </div>
</a>
<a
    href="dry.html"
    class="category-link"
>
    <div class="category">
        <img
            src="dry.webp"
            class="category-image"
        >
        <div
            class="category-name"
            id="dry"
        >
            Dry
        </div>
    </div>
</a>
<a
    href="extract.html"
    class="category-link"
>
    <div class="category">
        <img
            src="images.jpg"
            class="category-image"
        >
        <div
            class="category-name"
            id="extract"
        >
            Extract
        </div>
    </div>
</a>
<a
    href="VAPE.html"
    class="category-link"
>
    <div class="category">
        <img
            src="IMG_9790.jpeg"
            class="category-image"
        >
        <div
            class="category-name"
            id="vape"
        >
            VAPE
        </div>
    </div>
</a>
<a
    href="stickers.html"
    class="category-link"
>
    <div class="category sticker-category">
        <img
            src="IMG_9804.jpeg"
            class="sticker-image"
        >
        <div
            class="category-name"
            id="stickers"
        >
            🏷️ Stickers
        </div>
    </div>
</a>
</div>
<!-- ==========================
     CARRELLO
========================== -->
<div class="cart">
<div
    class="cart-title"
    id="cartTitle"
>
    🛒 Carrello
</div>
<div id="cart">
    Nessun prodotto
</div>
<button
    class="checkout"
    onclick="sendOrder()"
    id="orderButton"
>
    📲 Conferma ordine
</button>
<a href="bitcoin.html">
    <button class="checkout">
        ₿ Paga in Bitcoin
    </button>
</a>
</div>
<!-- ==========================
     JAVASCRIPT
========================== -->
<script src="language.js"></script>
</body>
</html>
