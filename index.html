<!-- CARRELLO GENERALE -->


<div class="cart">


<div class="cart-title">

🛒 Carrello

</div>



<div id="cart">

Nessun prodotto

</div>



<button class="checkout" onclick="sendOrder()">

📲 Conferma ordine

</button>



</div>






<script>


let cart = JSON.parse(localStorage.getItem("cart")) || [];



function showCart(){


let box = document.getElementById("cart");



if(cart.length === 0){

box.innerHTML="Nessun prodotto";

return;

}



box.innerHTML="";



cart.forEach((item,index)=>{


box.innerHTML +=

item +

' <button onclick="removeItem('+index+')">❌</button><br><br>';


});


}





function removeItem(index){


cart.splice(index,1);


localStorage.setItem("cart", JSON.stringify(cart));


showCart();


}





function sendOrder(){


if(cart.length === 0){

alert("Il carrello è vuoto");

return;

}



let ordine = cart.join("\n");


let messaggio =

"Ciao Oasis del Sur, vorrei ordinare:\n\n" + ordine;



let telegram =

"https://t.me/wordex17?text="

+ encodeURIComponent(messaggio);



window.location.href = telegram;


}





showCart();


</script>
