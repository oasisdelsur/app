<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oasis del Sur</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            align-items: center;

            width: 100%;
            padding: 30px 20px;

            width: min(250px, 70vw);

            border-radius: 50%;

            display: block;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 30px;
        }

            display: inline-block;

            text-decoration: none;

            padding: 16px 60px;
            border-radius: 30px;

            font-size: 20px;
            font-weight: bold;

            transition: 0.2s ease;
        }

        .enter:hover {
            background: #00ff88;
            transform: scale(1.05);
        }

        /* Versione telefono */
        @media (max-width: 600px) {

            .welcome {
                padding: 20px;
            }

            .logo {
                width: 70vw;
                height: 70vw;
                max-width: 250px;
                max-height: 250px;

                margin-bottom: 20px;
            }

            h1 {
                font-size: 26px;

            }

</head>
