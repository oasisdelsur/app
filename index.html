<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oasis del Sur</title>
    
    <!-- SCRIPT UFFICIALE TELEGRAM WEB APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Allinea tutto verso l'alto */
            align-items: center;
            text-align: center;
            padding-top: 10px;
        }
        .welcome {
            width: 100%;
            max-width: 500px;
            padding: 5px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* LOGO OTTIMIZZATO PER MEZZA SCHERMATA */
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* LINGUE */
        .languages {
            width: 210px;
            margin: 0 auto 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .language {
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .language.selected {
            border-color: #00e676;
            background: #181818;
        }
        /* TITOLO */
        h1 {
            margin: 0 0 10px;
            font-size: 18px;
            line-height: 1.2;
        }
        /* PULSANTE ENTRA */
        .enter {
            display: inline-block;
            background: #00e676;
            color: #000;
            text-decoration: none;
            padding: 10px 35px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="welcome">
        <!-- LOGO -->
        <div class="logo-container">
            <img src="IMG_9609.png" class="logo" alt="Oasis del Sur">
        </div>
        
        <!-- LINGUE -->
        <div class="languages">
            <button class="language selected" onclick="selectLanguage('it')">🇮🇹 Italiano</button>
            <button class="language" onclick="selectLanguage('en')">🇬🇧 English</button>
            <button class="language" onclick="selectLanguage('es')">🇪🇸 Español</button>
            <button class="language" onclick="selectLanguage('de')">🇩🇪 Deutsch</button>
        </div>
        
        <!-- TESTO DI BENVENUTO -->
        <h1 id="welcomeText">Benvenuto in Oasis del Sur</h1>
        
        <!-- ENTRA -->
        <a href="shop.html" class="enter" id="enterButton">ENTRA</a>
    </div>

    <script>
        // Forza l'espansione su Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const translations = {
            it: { welcome: "Benvenuto in Oasis del Sur", enter: "ENTRA" },
            en: { welcome: "Welcome to Oasis del Sur", enter: "ENTER" },
            es: { welcome: "Bienvenido a Oasis del Sur", enter: "ENTRAR" },
            de: { welcome: "Willkommen bei Oasis del Sur", enter: "EINTRETEN" }
        };

        function selectLanguage(language) {
            localStorage.setItem("language", language);
            document.documentElement.lang = language;
            document.getElementById("welcomeText").textContent = translations[language].welcome;
            document.getElementById("enterButton").textContent = translations[language].enter;
            
            document.querySelectorAll(".language").forEach(function(button) {
                button.classList.remove("selected");
            });

            const buttons = document.querySelectorAll(".language");
            const languageIndex = { it: 0, en: 1, es: 2, de: 3 };
            if (buttons[languageIndex[language]]) {
                buttons[languageIndex[language]].classList.add("selected");
            }
        }

        window.addEventListener("load", function() {
            const savedLanguage = localStorage.getItem("language") || "it";
            selectLanguage(savedLanguage);
        });
    </script>
</body>
</html>
