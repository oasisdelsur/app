<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oasis del Sur</title>
    
    <!-- SCRIPT UFFICIALE TELEGRAM WEB APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Impedisce lo scorrimento non necessario */
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome {
            width: 100%;
            max-width: 600px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* LOGO */
        .logo-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }
        /* LINGUE */
        .languages {
            width: 230px;
            margin: 0 auto 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .language {
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 9px;
            padding: 8px 5px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .language:hover {
            background: #222;
            transform: scale(1.03);
        }
        .language.selected {
            border-color: #00e676;
            background: #181818;
        }
        /* TITOLO */
        h1 {
            margin: 0 0 16px;
            font-size: 24px;
            line-height: 1.2;
        }
        /* PULSANTE */
        .enter {
            display: inline-block;
            background: #00e676;
            color: #000;
            text-decoration: none;
            padding: 12px 45px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s ease;
        }
        .enter:hover {
            background: #00ff88;
            transform: scale(1.05);
        }
        
        /* ADATTAMENTO TELEFONO */
        @media (max-width: 600px) {
            .welcome {
                padding: 10px 15px;
            }
            .logo-container {
                width: 170px;
                height: 170px;
                margin-bottom: 8px;
            }
            .languages {
                width: 210px;
                margin-bottom: 10px;
                gap: 5px;
            }
            .language {
                padding: 7px 4px;
                font-size: 13px;
            }
            h1 {
                font-size: 20px;
                margin-bottom: 14px;
            }
            .enter {
                padding: 12px 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome">
        <!-- LOGO -->
        <div class="logo-container">
            <img
                src="IMG_9609.png"
                class="logo"
                alt="Oasis del Sur"
            >
        </div>
        <!-- LINGUE -->
        <div class="languages">
            <button
                class="language selected"
                onclick="selectLanguage('it')"
            >
                🇮🇹 Italiano
            </button>
            <button
                class="language"
                onclick="selectLanguage('en')"
            >
                🇬🇧 English
            </button>
            <button
                class="language"
                onclick="selectLanguage('es')"
            >
                🇪🇸 Español
            </button>
            <button
                class="language"
                onclick="selectLanguage('de')"
            >
                🇩🇪 Deutsch
            </button>
        </div>
        <!-- TESTO DI BENVENUTO -->
        <h1 id="welcomeText">
            Benvenuto in Oasis del Sur
        </h1>
        <!-- ENTRA -->
        <a
            href="shop.html"
            class="enter"
            id="enterButton"
        >
            ENTRA
        </a>
    </div>

    <script>
        // FORZA L'APERTURA A SCHERMO INTERO SU TELEGRAM
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const translations = {
            it: {
                welcome: "Benvenuto in Oasis del Sur",
                enter: "ENTRA"
            },
            en: {
                welcome: "Welcome to Oasis del Sur",
                enter: "ENTER"
            },
            es: {
                welcome: "Bienvenido a Oasis del Sur",
                enter: "ENTRAR"
            },
            de: {
                welcome: "Willkommen bei Oasis del Sur",
                enter: "EINTRETEN"
            }
        };

        function selectLanguage(language) {
            localStorage.setItem("language", language);
            document.documentElement.lang = language;
            document.getElementById("welcomeText").textContent = translations[language].welcome;
            document.getElementById("enterButton").textContent = translations[language].enter;
            
            document.querySelectorAll(".language").forEach(function(button) {
                button.classList.remove("selected");
            });

            const buttons = document.querySelectorAll(".language");
            const languageIndex = { it: 0, en: 1, es: 2, de: 3 };
            if (buttons[languageIndex[language]]) {
                buttons[languageIndex[language]].classList.add("selected");
            }
        }

        window.addEventListener("load", function() {
            const savedLanguage = localStorage.getItem("language") || "it";
            selectLanguage(savedLanguage);
        });
    </script>
</body>
</html>
