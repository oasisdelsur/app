<!-- ==========================
     FUNZIONI DI BENVENUTO
========================== -->
<script>
let selectedWelcomeLanguage = null;
/* ==========================
   SCELTA LINGUA
========================== */
function selectWelcomeLanguage(lang) {
    selectedWelcomeLanguage = lang;
    /* Evidenzia lingua scelta */
    document
        .querySelectorAll(".welcome-languages button")
        .forEach(function(button) {
            button.classList.remove("selected");
        });
    const selectedButton =
        document.getElementById("lang-" + lang);
    if (selectedButton) {
        selectedButton.classList.add("selected");
    }
    /* Testo di benvenuto */
    const welcomeText =
        document.getElementById("welcomeText");
    const enterButton =
        document.getElementById("enterButton");
    if (lang === "it") {
        welcomeText.innerHTML = "Benvenuto";
        enterButton.innerHTML = "ENTRA";
    }
    else if (lang === "es") {
        welcomeText.innerHTML = "Bienvenido";
        enterButton.innerHTML = "ENTRAR";
    }
    else if (lang === "en") {
        welcomeText.innerHTML = "Welcome";
        enterButton.innerHTML = "ENTER";
    }
    else if (lang === "de") {
        welcomeText.innerHTML = "Willkommen";
        enterButton.innerHTML = "EINTRETEN";
    }
}
/* ==========================
   ENTRA NEL SITO
========================== */
function enterSite() {
    /* Se non è stata scelta una lingua,
       usa italiano */
    if (!selectedWelcomeLanguage) {
        selectedWelcomeLanguage = "it";
    }
    /* Salva lingua */
    localStorage.setItem(
        "language",
        selectedWelcomeLanguage
    );
    /* Traduce il sito */
    if (typeof applyLanguage === "function") {
        applyLanguage(
            selectedWelcomeLanguage
        );
    }
    /* NASCONDE COMPLETAMENTE
       LA PAGINA DI BENVENUTO */
    const welcome =
        document.getElementById("welcomeScreen");
    if (welcome) {
        welcome.style.display = "none";
    }
}
/* ==========================
   AVVIO
========================== */
window.addEventListener("load", function() {
    /* Mostra il carrello */
    if (typeof showCart === "function") {
        showCart();
    }
    /* Controlla se esiste
       una lingua già salvata */
    const savedLanguage =
        localStorage.getItem("language");
    /*
       IMPORTANTE:
       Se esiste una lingua salvata,
       applichiamo la lingua ma
       mostriamo comunque la schermata
       di benvenuto.
       Così l'utente può scegliere
       nuovamente la lingua prima
       di entrare.
    */
    if (
        savedLanguage &&
        (
            savedLanguage === "it" ||
            savedLanguage === "es" ||
            savedLanguage === "en" ||
            savedLanguage === "de"
        )
    ) {
        selectedWelcomeLanguage =
            savedLanguage;
        selectWelcomeLanguage(
            savedLanguage
        );
    }
});
</script>
