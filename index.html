<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis del Sur</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome {
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
        }
        .logo-container {
            width: 280px;
            height: 280px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }
        /* SELETTORE LINGUA */
        .language-selector {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
        }
        .language-button {
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 15px;
            cursor: pointer;
        }
        .language-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 230px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 8px;
            z-index: 1000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .language-selector.open .language-menu {
            display: grid;
        }
        .language-menu button {
            background: #181818;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 10px 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .language-menu button:hover {
            background: #292929;
        }
        h1 {
            margin: 0 0 30px;
            font-size: 32px;
            line-height: 1.2;
        }
        .enter {
            display: inline-block;
            background: #00e676;
            color: #000;
            text-decoration: none;
            padding: 16px 60px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s ease;
        }
        .enter:hover {
            background: #00ff88;
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            .welcome {
                padding: 20px 15px;
            }
            .logo-container {
                width: 280px;
                height: 280px;
                max-width: 70vw;
                max-height: 70vw;
                margin-bottom: 15px;
            }
            .language-menu {
                width: 220px;
            }
            h1 {
                font-size: 26px;
                margin-bottom: 25px;
            }
            .enter {
                padding: 14px 50px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome">
        <div class="logo-container">
            <img
                src="IMG_9609.png"
                class="logo"
                alt="Oasis del Sur"
            >
        </div>
        <!-- SELETTORE LINGUA -->
        <div
            class="language-selector"
            id="languageSelector"
        >
            <button
                class="language-button"
                onclick="toggleLanguageMenu()"
            >
                🌐 Italiano ▾
            </button>
            <div class="language-menu">
                <button onclick="selectLanguage('it')">
                    🇮🇹 Italiano
                </button>
                <button onclick="selectLanguage('en')">
                    🇬🇧 English
                </button>
                <button onclick="selectLanguage('es')">
                    🇪🇸 Español
                </button>
                <button onclick="selectLanguage('de')">
                    🇩🇪 Deutsch
                </button>
            </div>
        </div>
        <h1>
            Benvenuto in Oasis del Sur
        </h1>
        <a
            href="shop.html"
            class="enter"
        >
            ENTRA
        </a>
    </div>
    <script>
        function toggleLanguageMenu() {
            const selector =
                document.getElementById(
                    "languageSelector"
                );
            selector.classList.toggle("open");
        }
        function selectLanguage(language) {
            const names = {
                it: "🌐 🇮🇹 Italiano",
                en: "🌐 🇬🇧 English",
                es: "🌐 🇪🇸 Español",
                de: "🌐 🇩🇪 Deutsch"
            };
            document.querySelector(
                ".language-button"
            ).textContent =
                names[language] + " ▾";
            document
                .getElementById(
                    "languageSelector"
                )
                .classList.remove("open");
            localStorage.setItem(
                "language",
                language
            );
        }
        document.addEventListener(
            "click",
            function(event) {
                const selector =
                    document.getElementById(
                        "languageSelector"
                    );
                if (
                    !selector.contains(
                        event.target
                    )
                ) {
                    selector.classList.remove(
                        "open"
                    );
                }
            }
        );
        window.addEventListener(
            "load",
            function() {
                const savedLanguage =
                    localStorage.getItem(
                        "language"
                    );
                if (savedLanguage) {
                    selectLanguage(
                        savedLanguage
                    );
                }
            }
        );
    </script>
</body>
</html>
