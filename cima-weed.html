<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cima Weed - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 14px 40px 14px;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
}

.top-back {
    max-width: 600px;
    margin: 0 auto 14px auto;
}

.top-back a {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(15, 25, 18, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    font-size: 13px;
}

.wrap {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    background: linear-gradient(145deg, rgba(25, 20, 10, 0.92), rgba(15, 15, 8, 0.95));
    border: 1px solid rgba(255, 215, 0, 0.45);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), inset 0 0 15px rgba(255, 215, 0, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, #ffd700 40%, #ffae00 70%, #ff8c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #ffd700;
    text-transform: uppercase;
    margin-top: 6px;
    border-top: 1px solid rgba(255, 215, 0, 0.3);
    padding-top: 4px;
    width: 60%;
}

.media-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 22px;
}

.media-card {
    padding: 10px;
    border-radius: 18px;
    background: rgba(15, 22, 16, 0.88);
    border: 1px solid rgba(76, 175, 80, 0.35);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.product-image, .product-video {
    width: 100%;
    height: 210px;
    display: block;
    border-radius: 14px;
    object-fit: cover;
    object-position: center;
}

.single-gadget-btn {
    width: 100%;
    margin-top: 10px;
    background: rgba(15, 30, 18, 0.9);
    border: 1px solid rgba(76, 175, 80, 0.5);
    border-radius: 12px;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 800;
    padding: 11px 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.single-gadget-btn::after {
    content: "＋";
    font-size: 16px;
    color: #4CAF50;
    flex-shrink: 0;
}

.single-gadget-btn:hover, .single-gadget-btn:active {
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    border-color: #66bb6a;
}

.cart-card {
    width: 100%;
    max-width: 600px;
    background: rgba(10, 20, 12, 0.92);
    border: 1px solid rgba(50, 205, 50, 0.35);
    border-radius: 22px;
    padding: 20px;
    margin: 25px auto 20px auto;
    color: #ffffff;
    box-shadow: 0 0 20px rgba(50, 205, 50, 0.15);
}

.cart-title-custom {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #4CAF50;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
}

#mini-cart {
    font-size: 14px;
    color: #e0e0e0;
    margin-bottom: 16px;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.cart-item-row button {
    background: rgba(255, 59, 48, 0.2);
    color: #ff6961;
    border: 1px solid rgba(255, 59, 48, 0.4);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.cart-actions-integrated {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.btn-action-int {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    padding: 12px 8px;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-decoration: none;
}

.btn-action-int.primary {
    background: linear-gradient(135deg, #1e7e34, #155724);
    border: 1px solid rgba(76, 175, 80, 0.55);
}

@media (max-width: 500px) {
    .section-title-text {
        font-size: 20px;
        letter-spacing: 2px;
    }
    .product-image, .product-video {
        height: 170px;
    }
    .single-gadget-btn {
        font-size: 11px;
        padding: 10px 8px;
    }
}
</style>
</head>
<body>

<div class="top-back">
    <a href="gadget.html" id="back" data-translate="backToGadget">← Torna ai Gadget</a>
</div>

<div class="wrap">
    <div class="section-title-container">
        <div class="title-header">
            <span class="section-title-text">CIMA WEED</span>
        </div>
        <div class="title-badge">GADGET EDITION</div>
    </div>

    <div class="media-grid-2">
        <div class="media-card">
            <img src="IMG_1780.png" class="product-image" alt="Cima Weed 1">
            <button type="button" class="single-gadget-btn" onclick="addGadget('CIMA WEED (Foto 1) - 1 solo gadget disponibile')">
                <span data-translate="onlyOneGadget">1 solo gadget disponibile</span>
            </button>
        </div>

        <div class="media-card">
            <img src="IMG_1781.png" class="product-image" alt="Cima Weed 2">
            <button type="button" class="single-gadget-btn" onclick="addGadget('CIMA WEED (Foto 2) - 1 solo gadget disponibile')">
                <span data-translate="onlyOneGadget">1 solo gadget disponibile</span>
            </button>
        </div>

        <div class="media-card">
            <img src="IMG_1782.png" class="product-image" alt="Cima Weed 3">
            <button type="button" class="single-gadget-btn" onclick="addGadget('CIMA WEED (Foto 3) - 1 solo gadget disponibile')">
                <span data-translate="onlyOneGadget">1 solo gadget disponibile</span>
            </button>
        </div>

        <div class="media-card">
            <video class="product-video" controls muted playsinline preload="metadata">
                <source src="IMG_1688.mov" type="video/mp4">
                <source src="IMG_1688.mov" type="video/quicktime">
            </video>
            <button type="button" class="single-gadget-btn" onclick="addGadget('CIMA WEED (Video) - 1 solo gadget disponibile')">
                <span data-translate="onlyOneGadget">1 solo gadget disponibile</span>
            </button>
        </div>
    </div>

    <div class="cart-card" id="cart-section">
        <div class="cart-title-custom">
            <span id="cartText" data-translate="cartTitle">CARRELLO</span> <span>🛒</span>
        </div>
        <div id="mini-cart">
            <span data-translate="emptyCart">Carrello vuoto</span>
        </div>

        <div class="cart-actions-integrated">
            <a href="shop.html" class="btn-action-int primary" id="goCart">
                <span>🛒</span> <span data-translate="goToCart">Vai al carrello</span>
            </a>
            <a href="shop.html" class="btn-action-int" id="goMenu">
                <span>🏠</span> <span data-translate="backToMenu">Torna al menu</span>
            </a>
        </div>
    </div>
</div>

<script src="language.js"></script>

<script>
const translations = {
    it: {
        backToGadget: "← Torna ai Gadget",
        onlyOneGadget: "1 solo gadget disponibile",
        cartTitle: "CARRELLO",
        emptyCart: "Carrello vuoto",
        goToCart: "Vai al carrello",
        backToMenu: "Torna al menu",
        addedToCart: "aggiunto al carrello"
    },
    en: {
        backToGadget: "← Back to Gadgets",
        onlyOneGadget: "1 gadget only available",
        cartTitle: "CART",
        emptyCart: "Empty cart",
        goToCart: "Go to cart",
        backToMenu: "Back to menu",
        addedToCart: "added to cart"
    },
    es: {
        backToGadget: "← Volver a Gadgets",
        onlyOneGadget: "1 solo gadget disponible",
        cartTitle: "CARRITO",
        emptyCart: "Carrito vacío",
        goToCart: "Ir al carrito",
        backToMenu: "Volver al menú",
        addedToCart: "añadido al carrito"
    },
    de: {
        backToGadget: "← Zurück zu Gadgets",
        onlyOneGadget: "Nur 1 Gadget verfügbar",
        cartTitle: "WARENKORB",
        emptyCart: "Warenkorb leer",
        goToCart: "Zum Warenkorb",
        backToMenu: "Zurück zum Menü",
        addedToCart: "zum Warenkorb hinzugefügt"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

let gadgets = [];
let cart = [];

function syncStorage() {
    gadgets = JSON.parse(localStorage.getItem("gadgets")) || [];
    cart = JSON.parse(localStorage.getItem("cart")) || [];
}

function addGadget(product) {
    syncStorage();
    gadgets.push(product);
    cart.push("[GADGET] " + product);
    localStorage.setItem("gadgets", JSON.stringify(gadgets));
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();

    const lang = getLanguage();
    const t = translations[lang] || translations.it;
    alert("✅ " + product + " " + t.addedToCart);
}

function showMiniCart() {
    syncStorage();
    const box = document.getElementById("mini-cart");
    if (!box) return;

    const lang = getLanguage();
    const t = translations[lang] || translations.it;

    if (gadgets.length === 0) {
        box.innerHTML = t.emptyCart;
        return;
    }

    box.innerHTML = "";
    gadgets.forEach(function(item, index) {
        box.innerHTML +=
            '<div class="cart-item-row"><span>• ' + item + '</span>' +
            '<button onclick="removeItem(' + index + ')">❌ Rimuovi</button></div>';
    });
}

function removeItem(index) {
    syncStorage();
    const removed = gadgets[index];
    gadgets.splice(index, 1);

    if (removed) {
        const cartIdx = cart.lastIndexOf("[GADGET] " + removed);
        if (cartIdx !== -1) cart.splice(cartIdx, 1);
    }

    localStorage.setItem("gadgets", JSON.stringify(gadgets));
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
}

window.addEventListener("load", function() {
    translatePage();
    showMiniCart();
});

window.addEventListener("pageshow", function() {
    translatePage();
    showMiniCart();
});
</script>

</body>
</html>
