<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dry - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
<style>
.folder-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin: 25px 0;
}

.folder-card {
    display: flex;
    align-items: center;
    background: rgba(20, 30, 20, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 18px 20px;
    color: white;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, background 0.2s ease;
}

.folder-card:hover {
    transform: translateY(-2px);
    background: rgba(30, 45, 30, 0.85);
}

.folder-icon {
    font-size: 24px;
    margin-right: 15px;
}

.folder-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}
</style>
</head>
<body>
<div class="container">
    <div class="section-title" id="dryTitle">
        💨 Dry
    </div>
    
    <div class="back-button">
        <a href="index.html" id="back">
            ← Indietro
        </a>
    </div>

    <div class="folder-list">
        <a href="grape-fruit.html" class="folder-card">
            <span class="folder-icon">📁</span>
            <span class="folder-title">21/21 = GRAPE FRUIT</span>
        </a>

        <a href="lemon-lobster.html" class="folder-card">
            <span class="folder-icon">📁</span>
            <span class="folder-title">LA LINEA = LEMON LOBSTER</span>
        </a>
    </div>
</div>

<div class="cart">
    <div class="cart-title" id="cartTitle">
        🛒 Carrello
    </div>
    <div id="cart">
        Nessun prodotto
    </div>
    <button class="checkout" id="orderButton" onclick="sendOrder()">
        📲 Conferma ordine
    </button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function showCart() {
    const box = document.getElementById("cart");
    if (!box) return;
    
    if (cart.length === 0) {
        box.innerHTML = "Nessun prodotto";
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML += item + ' <button onclick="removeItem(' + index + ')">❌</button><br><br>';
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showCart();
}

function sendOrder() {
    if (cart.length === 0) {
        alert("Il carrello è vuoto");
        return;
    }
    const ordine = cart.join("\n");
    const messaggio = "Ciao Oasis del Sur, vorrei ordinare:\n\n" + ordine;
    const telegram = "https://t.me/wordex17?text=" + encodeURIComponent(messaggio);
    window.location.href = telegram;
}

showCart();
</script>
</body>
</html>
