<body>


<div class="container">



<div class="section-header">

🌱 Dry

</div>



<div class="language-box">


<button class="language-button" onclick="openLanguage()">

🌐 Language ▾

</button>



<div class="language-menu" id="languageMenu">

<button onclick="changeLanguage('it')">🇮🇹 Italiano</button>

<button onclick="changeLanguage('es')">🇪🇸 Español</button>

<button onclick="changeLanguage('en')">🇬🇧 English</button>

<button onclick="changeLanguage('de')">🇩🇪 Deutsch</button>

</div>


</div>


</div>





<div class="back-button">

<a href="index.html" id="back">

← Indietro

</a>

</div>





<div class="products">



<div class="product">

<a href="highland-terps.html" class="category-link">

<div class="product-name">

Highland Terps

</div>

</a>

</div>





<div class="product">

<a href="rocket-seeds.html" class="category-link">

<div class="product-name">

Rocket Seeds

</div>

</a>

</div>





<div class="product">

<a href="gas-mint.html" class="category-link">

<div class="product">

</div>

<div class="cart">

Nessun prodotto

</div>



<button class="checkout" id="orderButton">

📲 Conferma ordine

</button>


</div>







<script src="language.js"></script>


<script>


function openLanguage(){

document.getElementById("languageMenu").classList.toggle("show");

}




function changeLanguage(lang){


localStorage.setItem("language",lang);


let t=translations[lang];



document.getElementById("dryTitle").innerHTML="🌱 "+t.dry;

document.getElementById("back").innerHTML=t.back;

document.getElementById("cartTitle").innerHTML=t.cart;

document.getElementById("orderButton").innerHTML=t.order;



document.getElementById("languageMenu").classList.remove("show");


}





window.onload=function(){


let saved=localStorage.getItem("language");


if(saved){

changeLanguage(saved);

}


}



</script>



</body>
