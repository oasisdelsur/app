<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Dry - Oasis del Sur</title>
<link
    rel="stylesheet"
    href="style.css"
>
<style>
/* ==========================
   DRY - PAGINA VUOTA
========================== */
.empty-dry {
    width: 100%;
    max-width: 650px;
    margin: 70px auto;
    padding: 55px 30px;
    text-align: center;
    border-radius: 25px;
    background: rgba(20,20,20,.75);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(0,255,120,.18);
    box-shadow:
        0 0 35px rgba(0,255,120,.08),
        0 15px 45px rgba(0,0,0,.7);
}
.empty-icon {
    font-size: 55px;
    margin-bottom: 20px;
}
.empty-title {
    color: white;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 12px;
}
.empty-text {
    color: rgba(255,255,255,.65);
    font-size: 17px;
    line-height: 1.6;
}
.empty-line {
    width: 60px;
    height: 2px;
    margin: 25px auto;
    background: rgba(0,255,120,.5);
    box-shadow:
        0 0 10px rgba(0,255,120,.4);
}
/* TELEFONO */
@media (max-width: 500px) {
    .empty-dry {
        margin: 45px auto;
        padding: 45px 20px;
    }
    .empty-icon {
        font-size: 48px;
    }
    .empty-title {
        font-size: 24px;
    }
    .empty-text {
        font-size: 15px;
    }
}
</style>
</head>
<body>
<div class="container">
    <!-- TITOLO -->
    <div
        class="section-title"
        id="dryTitle"
    >
        🌱 Dry
    </div>
    <!-- INDIETRO -->
    <div class="back-button">
        <a
            href="shop.html"
            id="back"
        >
            ← Indietro
        </a>
    </div>
    <!-- PAGINA VUOTA -->
    <div class="empty-dry">
        <div class="empty-icon">
            🌱
        </div>
        <div class="empty-title">
            DRY
        </div>
        <div class="empty-line"></div>
        <div class="empty-text">
            Nuovi prodotti in arrivo.<br>
            La selezione Dry sarà disponibile presto.
        </div>
    </div>
</div>
<!-- CARRELLO -->
<div class="cart">
    <div
        class="cart-title"
        id="cartTitle"
    >
        🛒 Carrello
    </div>
    <div id="cart">
        Nessun prodotto
    </div>
    <button
        class="checkout"
        id="orderButton"
        onclick="sendOrder()"
    >
        📲 Conferma ordine
    </button>
</div>
<script src="language.js"></script>
<script>
let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];
function showCart() {
    const box =
        document.getElementById("cart");
    if (!box) return;
    const lang =
        localStorage.getItem("language") || "it";
    const t =
        translations[lang] ||
        translations.it;
    if (cart.length === 0) {
        box.innerHTML =
            t.emptyCart ||
            "Nessun prodotto";
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML +=
            item +
            ' <button onclick="removeItem(' +
            index +
            ')">❌</button>' +
            '<br><br>';
    });
}
function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );
    showCart();
}
function sendOrder() {
    const lang =
        localStorage.getItem("language") || "it";
    const t =
        translations[lang] ||
        translations.it;
    if (cart.length === 0) {
        alert(
            t.emptyAlert ||
            "Il carrello è vuoto"
        );
        return;
    }
    const ordine =
        cart.join("\n");
    const messaggio =
        (
            t.orderMessage ||
            "Ciao Oasis del Sur, vorrei ordinare:"
        ) +
        "\n\n" +
        ordine;
    const telegram =
        "https://t.me/wordex17?text=" +
        encodeURIComponent(
            messaggio
        );
    window.location.href =
        telegram;
}
window.addEventListener(
    "load",
    function() {
        const lang =
            localStorage.getItem("language") || "it";
        if (
            typeof changeLanguage === "function"
        ) {
            changeLanguage(lang);
        }
        showCart();
    }
);
</script>
</body>
</html>
