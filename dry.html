<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Dry - Oasis del Sur</title>
<link
    rel="stylesheet"
    href="style.css"
>
<style>
/* ==========================
   DRY — COMING SOON
========================== */
.dry-coming {
    min-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 45px auto;
    position: relative;
    overflow: hidden;
    border-radius: 30px;
    background:
        radial-gradient(
            circle at center,
            rgba(0,255,120,.10),
            transparent 55%
        ),
        rgba(10,10,10,.72);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(0,255,120,.18);
    box-shadow:
        0 0 50px rgba(0,255,120,.08),
        0 20px 60px rgba(0,0,0,.8);
}
/* BAGLIORE */
.dry-coming::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(0,255,120,.08);
    filter: blur(70px);
    animation: glow 4s ease-in-out infinite;
}
@keyframes glow {
    0%, 100% {
        transform: scale(.85);
        opacity: .5;
    }
    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}
/* CONTENUTO */
.dry-content {
    position: relative;
    z-index: 2;
    text-align: center;
}
.dry-leaf {
    font-size: 70px;
    margin-bottom: 15px;
    filter:
        drop-shadow(
            0 0 15px
            rgba(0,255,120,.35)
        );
}
.dry-title {
    color: white;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 8px;
    margin: 0;
    text-shadow:
        0 0 20px
        rgba(0,255,120,.18);
}
.dry-status {
    margin-top: 18px;
    color: rgba(0,255,120,.75);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 4px;
}
.dry-line {
    width: 90px;
    height: 2px;
    margin: 25px auto;
    background: rgba(0,255,120,.5);
    box-shadow:
        0 0 15px
        rgba(0,255,120,.5);
}
.dry-message {
    color: rgba(255,255,255,.55);
    font-size: 15px;
    letter-spacing: 1px;
}
/* MOBILE */
@media (max-width: 500px) {
    .dry-coming {
        min-height: 380px;
        margin: 30px auto;
    }
    .dry-leaf {
        font-size: 58px;
    }
    .dry-title {
        font-size: 40px;
        letter-spacing: 6px;
    }
    .dry-status {
        font-size: 11px;
    }
}
</style>
</head>
<body>
<div class="container">
    <!-- TITOLO -->
    <div
        class="section-title"
        id="dryTitle"
    >
        🌱 Dry
    </div>
    <!-- INDIETRO -->
    <div class="back-button">
        <a
            href="shop.html"
            id="back"
        >
            ← Indietro
        </a>
    </div>
    <!-- COMING SOON -->
    <div class="dry-coming">
        <div class="dry-content">
            <div class="dry-leaf">
                🌱
            </div>
            <h1 class="dry-title">
                DRY
            </h1>
            <div class="dry-status">
                COMING SOON
            </div>
            <div class="dry-line"></div>
            <div class="dry-message">
                La selezione sta arrivando.
            </div>
        </div>
    </div>
</div>
<!-- CARRELLO -->
<div class="cart">
    <div
        class="cart-title"
        id="cartTitle"
    >
        🛒 Carrello
    </div>
    <div id="cart">
        Nessun prodotto
    </div>
    <button
        class="checkout"
        id="orderButton"
        onclick="sendOrder()"
    >
        📲 Conferma ordine
    </button>
</div>
<script src="language.js"></script>
<script>
let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];
function showCart() {
    const box =
        document.getElementById("cart");
    if (!box) return;
    const lang =
        localStorage.getItem("language") || "it";
    const t =
        translations[lang] ||
        translations.it;
    if (cart.length === 0) {
        box.innerHTML =
            t.emptyCart ||
            "Nessun prodotto";
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML +=
            item +
            ' <button onclick="removeItem(' +
            index +
            ')">❌</button>' +
            '<br><br>';
    });
}
function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );
    showCart();
}
function sendOrder() {
    const lang =
        localStorage.getItem("language") || "it";
    const t =
        translations[lang] ||
        translations.it;
    if (cart.length === 0) {
        alert(
            t.emptyAlert ||
            "Il carrello è vuoto"
        );
        return;
    }
    const ordine =
        cart.join("\n");
    const messaggio =
        (
            t.orderMessage ||
            "Ciao Oasis del Sur, vorrei ordinare:"
        ) +
        "\n\n" +
        ordine;
    const telegram =
        "https://t.me/wordex17?text=" +
        encodeURIComponent(
            messaggio
        );
    window.location.href =
        telegram;
}
window.addEventListener(
    "load",
    function() {
        const lang =
            localStorage.getItem("language") || "it";
        if (
            typeof changeLanguage === "function"
        ) {
            changeLanguage(lang);
        }
        showCart();
    }
);
</script>
</body>
</html>
