<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis del Sur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="back-button">
        <a href="index.html">←</a>
    </div>
    <a href="weed.html" class="category-link">
        <div class="category">
            <img src="a82ad9_3bc1726cb8bd4951bf8e445cf043f960~mv2.avif" class="category-image" alt="Weed">
            <div class="category-name" data-translate="weed">Weed</div>
        </div>
    </a>
    <a href="frozen.html" class="category-link">
        <div class="category">
            <img src="frozen.jpg" class="category-image" alt="Frozen">
            <div class="category-name" data-translate="frozen">Frozen</div>
        </div>
    </a>
    <a href="dry.html" class="category-link">
        <div class="category">
            <img src="dry.webp" class="category-image" alt="Dry">
            <div class="category-name" data-translate="dry">Dry</div>
        </div>
    </a>
    <a href="extract.html" class="category-link">
        <div class="category">
            <img src="images.jpg" class="category-image" alt="Extract">
            <div class="category-name" data-translate="extract">Extract</div>
        </div>
    </a>
    <a href="VAPE.html" class="category-link">
        <div class="category">
            <img src="IMG_9790.jpeg" class="category-image" alt="VAPE">
            <div class="category-name" data-translate="vape">VAPE</div>
        </div>
    </a>
    <a href="sim.html" class="category-link">
        <div class="category">
            <img src="IMG_1537.jpeg" class="category-image" alt="SIM">
            <div class="category-name" data-translate="sim">SIM</div>
        </div>
    </a>
    <a href="stickers.html" class="category-link">
        <div class="category">
            <img src="IMG_1531.jpeg" class="category-image" alt="Stickers">
            <div class="category-name" data-translate="stickers">🏷️ Stickers</div>
        </div>
    </a>
</div>

<div class="cart">
    <div class="cart-title" data-translate="cartTitle">🛒 Carrello</div>
    <div id="cart">
        <span data-translate="emptyCart">Nessun prodotto</span>
    </div>
    <button class="checkout" onclick="sendOrder()" data-translate="confirmOrder">📲 Conferma ordine</button>
    <a href="bitcoin.html">
        <button class="checkout" data-translate="payBitcoin">₿ Paga in Bitcoin</button>
    </a>
</div>

<script>
const translations = {
    it: {
        weed: "WEED", frozen: "FROZEN", dry: "DRY", extract: "EXTRACT", vape: "VAPE", sim: "SIM", stickers: "STICKERS",
        cartTitle: "🛒 Carrello", emptyCart: "Nessun prodotto", confirmOrder: "📲 Conferma ordine", payBitcoin: "₿ Paga in Bitcoin",
        emptyAlert: "Il carrello è vuoto", orderMessage: "Ciao Oasis del Sur, vorrei ordinare:"
    },
    en: {
        weed: "WEED", frozen: "FROZEN", dry: "DRY", extract: "EXTRACT", vape: "VAPE", sim: "SIM", stickers: "STICKERS",
        cartTitle: "🛒 Cart", emptyCart: "No products", confirmOrder: "📲 Confirm order", payBitcoin: "₿ Pay with Bitcoin",
        emptyAlert: "The cart is empty", orderMessage: "Hello Oasis del Sur, I would like to order:"
    },
    es: {
        weed: "WEED", frozen: "FROZEN", dry: "DRY", extract: "EXTRACT", vape: "VAPE", sim: "SIM", stickers: "STICKERS",
        cartTitle: "🛒 Carrito", emptyCart: "Ningún producto", confirmOrder: "📲 Confirmar pedido", payBitcoin: "₿ Pagar con Bitcoin",
        emptyAlert: "El carrello está vacío", orderMessage: "Hola Oasis del Sur, quisiera hacer un pedido:"
    },
    de: {
        weed: "WEED", frozen: "FROZEN", dry: "DRY", extract: "EXTRAKTE", vape: "VAPE", sim: "SIM", stickers: "STICKERS",
        cartTitle: "🛒 Warenkorb", emptyCart: "Keine Produkte", confirmOrder: "📲 Bestellung bestätigen", payBitcoin: "₿ Mit Bitcoin bezahlen",
        emptyAlert: "Der Warenkorb ist leer", orderMessage: "Hallo Oasis del Sur, ich möchte bestellen:"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const language = getLanguage();
    const texts = translations[language];
    document.documentElement.lang = language;
    document.querySelectorAll("[data-translate]").forEach(function(element) {
        const key = element.getAttribute("data-translate");
        if (texts[key]) {
            element.textContent = texts[key];
        }
    });
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let stickers = JSON.parse(localStorage.getItem("stickers")) || [];

function reindexStickers() {
    stickers = stickers.map((_, index) => "Sticker " + (index + 1));
}

function showCart() {
    const box = document.getElementById("cart");
    if (cart.length === 0 && stickers.length === 0) {
        box.innerHTML = translations[getLanguage()].emptyCart;
        return;
    }
    
    box.innerHTML = "";
    
    cart.forEach(function(product, index) {
        box.innerHTML += "• " + product +
            ' <button onclick="removeOneItem(' + index + ')">❌</button><br><br>';
    });

    stickers.forEach(function(sticker, index) {
        box.innerHTML += "• " + sticker +
            ' <button onclick="removeOneSticker(' + index + ')">❌</button><br><br>';
    });
}

function removeOneItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showCart();
}

function removeOneSticker(index) {
    stickers.splice(index, 1);
    reindexStickers();
    localStorage.setItem("stickers", JSON.stringify(stickers));
    showCart();
}

function sendOrder() {
    if (cart.length === 0 && stickers.length === 0) {
        alert(translations[getLanguage()].emptyAlert);
        return;
    }
    
    let ordine = "";
    cart.forEach(function(product) {
        ordine += product + "\n";
    });

    stickers.forEach(function(sticker) {
        ordine += sticker + "\n";
    });

    const messaggio = translations[getLanguage()].orderMessage + "\n\n" + ordine;
    window.location.href = "https://t.me/wordex17?text=" + encodeURIComponent(messaggio);
}

window.addEventListener("load", function() {
    translatePage();
    reindexStickers();
    localStorage.setItem("stickers", JSON.stringify(stickers));
    showCart();
});
</script>
</body>
</html>
