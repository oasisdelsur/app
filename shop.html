<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Oasis del Sur</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>
<body>
<div class="container">
    <div class="back-button">
        <a href="index.html">
            <span class="back-circle">←</span>
            <span class="back-label" data-translate="backHome">TORNA ALLA HOME</span>
        </a>
    </div>
    <a href="weed.html" class="category-link">
        <div class="category">
            <img src="a82ad9_3bc1726cb8bd4951bf8e445cf043f960~mv2.avif" class="category-image" alt="Weed">
            <div class="category-name" data-translate="weed">Weed</div>
        </div>
    </a>
    <a href="frozen.html" class="category-link">
        <div class="category">
            <img src="frozen.jpg" class="category-image" alt="Frozen">
            <div class="category-name" data-translate="frozen">Frozen</div>
        </div>
    </a>
    <a href="dry.html" class="category-link">
        <div class="category">
            <img src="dry.webp" class="category-image" alt="Dry">
            <div class="category-name" data-translate="dry">Dry</div>
        </div>
    </a>
    <a href="static.html" class="category-link">
        <div class="category">
            <img src="hq720.jpg" class="category-image" alt="STATIC">
            <div class="category-name" data-translate="staticCat">STATIC</div>
        </div>
    </a>
    <a href="extract.html" class="category-link">
        <div class="category">
            <img src="images.jpg" class="category-image" alt="ICE - EXTRACT">
            <div class="category-name" data-translate="extract">ICE - EXTRACT</div>
        </div>
    </a>
    <a href="VAPE.html" class="category-link">
        <div class="category">
            <img src="IMG_9790.jpeg" class="category-image" alt="VAPE">
            <div class="category-name" data-translate="vape">VAPE</div>
        </div>
    </a>
    <a href="sim.html" class="category-link">
        <div class="category">
            <img src="IMG_1537.jpeg" class="category-image" alt="SIM">
            <div class="category-name" data-translate="sim">SIM</div>
        </div>
    </a>
    <a href="gadget.html" class="category-link">
        <div class="category">
            <img src="IMG_1721.jpeg" class="category-image" alt="Gadget">
            <div class="category-name" data-translate="gadget">🎁 Gadget</div>
        </div>
    </a>
</div>

<div class="cart">
    <div class="cart-title" data-translate="cartTitle">
        🛒 Carrello
    </div>
    <div id="cart">
        <span data-translate="emptyCart">
            Nessun prodotto
        </span>
    </div>
    <button class="checkout" onclick="sendOrder()" data-translate="confirmOrder">
        📲 Conferma ordine
    </button>
    <a href="bitcoin.html">
        <button class="checkout" data-translate="payBitcoin">
            ₿ Paga in Bitcoin
        </button>
    </a>
    <a href="spedizioni.html">
        <button class="checkout" data-translate="shipping">
            📦 Spedizioni
        </button>
    </a>
</div>

<script>
const translations = {
    it: {
        backHome: "TORNA ALLA HOME",
        weed: "WEED",
        frozen: "FROZEN",
        dry: "DRY",
        extract: "ICE - EXTRACT",
        vape: "VAPE",
        sim: "SIM",
        staticCat: "STATIC",
        gadget: "GADGET",
        cartTitle: "🛒 Carrello",
        emptyCart: "Nessun prodotto",
        confirmOrder: "📲 Conferma ordine",
        payBitcoin: "₿ Paga in Bitcoin",
        shipping: "📦 Spedizioni",
        emptyAlert: "Il carrello è vuoto",
        orderMessage: "Ciao Oasis del Sur, vorrei ordinare:"
    },
    en: {
        backHome: "BACK TO HOME",
        weed: "WEED",
        frozen: "FROZEN",
        dry: "DRY",
        extract: "ICE - EXTRACT",
        vape: "VAPE",
        sim: "SIM",
        staticCat: "STATIC",
        gadget: "GADGETS",
        cartTitle: "🛒 Cart",
        emptyCart: "No products",
        confirmOrder: "📲 Confirm order",
        payBitcoin: "₿ Pay with Bitcoin",
        shipping: "📦 Shipping",
        emptyAlert: "The cart is empty",
        orderMessage: "Hello Oasis del Sur, I would like to order:"
    },
    es: {
        backHome: "VOLVER AL INICIO",
        weed: "WEED",
        frozen: "FROZEN",
        dry: "DRY",
        extract: "ICE - EXTRACT",
        vape: "VAPE",
        sim: "SIM",
        staticCat: "STATIC",
        gadget: "GADGETS",
        cartTitle: "🛒 Carrito",
        emptyCart: "Ningún producto",
        confirmOrder: "📲 Confirmar pedido",
        payBitcoin: "₿ Pagar con Bitcoin",
        shipping: "📦 Envíos",
        emptyAlert: "El carrito está vacío",
        orderMessage: "Hola Oasis del Sur, quisiera hacer un pedido:"
    },
    de: {
        backHome: "ZUR STARTSEITE",
        weed: "WEED",
        frozen: "FROZEN",
        dry: "DRY",
        extract: "ICE - EXTRACT",
        vape: "VAPE",
        sim: "SIM",
        staticCat: "STATIC",
        gadget: "GADGETS",
        cartTitle: "🛒 Warenkorb",
        emptyCart: "Keine Produkte",
        confirmOrder: "📲 Bestellung bestätigen",
        payBitcoin: "₿ Mit Bitcoin bezahlen",
        shipping: "📦 Versand",
        emptyAlert: "Der Warenkorb ist leer",
        orderMessage: "Hallo Oasis del Sur, ich möchte bestellen:"
    }
};

function getLanguage() {
    const saved = localStorage.getItem("language") || "it";
    return translations[saved] ? saved : "it";
}

function translatePage() {
    const language = getLanguage();
    const texts = translations[language];
    document.documentElement.lang = language;
    document.querySelectorAll("[data-translate]").forEach(function(element) {
        const key = element.getAttribute("data-translate");
        if (texts[key]) {
            element.textContent = texts[key];
        }
    });
}

let cart = [];
let stickers = [];
let gadgets = [];

function syncStorage() {
    cart = JSON.parse(localStorage.getItem("cart")) || [];
    stickers = JSON.parse(localStorage.getItem("stickers")) || [];
    gadgets = JSON.parse(localStorage.getItem("gadgets")) || [];
}

function getGroupedList(arr) {
    const grouped = {};
    arr.forEach(function(item) {
        grouped[item] = (grouped[item] || 0) + 1;
    });
    return grouped;
}

function showCart() {
    syncStorage();
    const box = document.getElementById("cart");
    if (cart.length === 0 && stickers.length === 0 && gadgets.length === 0) {
        box.innerHTML = translations[getLanguage()].emptyCart;
        return;
    }

    const grouped = getGroupedList(cart);
    const groupedStickers = getGroupedList(stickers);
    const groupedGadgets = getGroupedList(gadgets);

    box.innerHTML = "";

    Object.keys(grouped).forEach(function(product) {
        box.innerHTML +=
            "• " + product + " × " + grouped[product] +
            ' <button onclick="removeOneItem(\'' + product.replace(/'/g, "\\'") + '\')">❌</button><br><br>';
    });

    Object.keys(groupedStickers).forEach(function(sticker) {
        box.innerHTML +=
            "• [STATIC] " + sticker + " × " + groupedStickers[sticker] +
            ' <button onclick="removeOneSticker(\'' + sticker.replace(/'/g, "\\'") + '\')">❌</button><br><br>';
    });

    Object.keys(groupedGadgets).forEach(function(gadget) {
        box.innerHTML +=
            "• [GADGET] " + gadget + " × " + groupedGadgets[gadget] +
            ' <button onclick="removeOneGadget(\'' + gadget.replace(/'/g, "\\'") + '\')">❌</button><br><br>';
    });
}

function removeOneItem(product) {
    syncStorage();
    const index = cart.lastIndexOf(product);
    if (index !== -1) cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showCart();
}

function removeOneSticker(sticker) {
    syncStorage();
    const index = stickers.lastIndexOf(sticker);
    if (index !== -1) stickers.splice(index, 1);
    localStorage.setItem("stickers", JSON.stringify(stickers));
    showCart();
}

function removeOneGadget(gadget) {
    syncStorage();
    const index = gadgets.lastIndexOf(gadget);
    if (index !== -1) gadgets.splice(index, 1);
    localStorage.setItem("gadgets", JSON.stringify(gadgets));
    showCart();
}

function sendOrder() {
    syncStorage();
    if (cart.length === 0 && stickers.length === 0 && gadgets.length === 0) {
        alert(translations[getLanguage()].emptyAlert);
        return;
    }

    const grouped = getGroupedList(cart);
    const groupedStickers = getGroupedList(stickers);
    const groupedGadgets = getGroupedList(gadgets);

    let ordine = "";
    Object.keys(grouped).forEach(function(product) {
        ordine += product + " × " + grouped[product] + "\n";
    });

    if (stickers.length > 0) {
        ordine += "\nSTATIC:\n";
        Object.keys(groupedStickers).forEach(function(sticker) {
            ordine += sticker + " × " + groupedStickers[sticker] + "\n";
        });
    }

    if (gadgets.length > 0) {
        ordine += "\nGADGETS:\n";
        Object.keys(groupedGadgets).forEach(function(gadget) {
            ordine += gadget + " × " + groupedGadgets[gadget] + "\n";
        });
    }

    const messaggio = translations[getLanguage()].orderMessage + "\n\n" + ordine;
    window.location.href = "https://t.me/wordex17?text=" + encodeURIComponent(messaggio);
}

window.addEventListener("load", function() {
    translatePage();
    showCart();
});

window.addEventListener("pageshow", function() {
    translatePage();
    showCart();
});
</script>
</body>
</html>
