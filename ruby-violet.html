<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUBY VIOLET - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
<style>
/* STILE IMMAGINI E VIDEO */
.product-image, .product-video {
    width: 100%;
    max-width: 600px;
    height: 350px;
    display: block;
    margin: 0 auto 20px auto;
    border-radius: 18px;
    object-fit: cover;
    object-position: center;
}

/* CARRELLO MODERNO IN STILE GLASS */
.cart-card {
    background: rgba(15, 25, 18, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 20px;
    margin: 25px 0 20px 0;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

.cart-title-custom {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 10px;
}

#mini-cart {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.85);
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.cart-item-row button {
    background: rgba(229, 9, 20, 0.2);
    color: #ff4d4d;
    border: 1px solid rgba(229, 9, 20, 0.4);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.cart-item-row button:hover {
    background: #e50914;
    color: #fff;
}

/* CONTENITORE GRIGLIA BOTTONI AZIONE */
.action-buttons-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 14px 10px;
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.btn-action:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
}

.btn-action.primary {
    background: linear-gradient(135deg, rgba(34, 139, 34, 0.6), rgba(20, 90, 20, 0.8));
    border: 1px solid rgba(76, 175, 80, 0.4);
}

.btn-action.primary:hover {
    background: linear-gradient(135deg, rgba(46, 160, 46, 0.8), rgba(25, 110, 25, 0.95));
}

@media (max-width: 500px) {
    .product-image, .product-video {
        width: 100%;
        max-width: 100%;
        height: 280px;
        object-fit: cover;
    }
}
</style>
</head>
<body>

<div class="back-button">
    <a href="weed.html" id="back" data-translate="backToWeed">
        ← Torna a Weed
    </a>
</div>

<div class="container">
    <div class="section-title">
         🌿 RUBY VIOLET 💜
    </div>

    <div class="product">
        <!-- IMMAGINI SPECIFICHE -->
        <img src="IMG_2310.png" class="product-image" alt="RUBY VIOLET">
        <img src="IMG_2311.png" class="product-image" alt="RUBY VIOLET">
        <img src="IMG_2312.png" class="product-image" alt="RUBY VIOLET">
        <img src="IMG_2313.png" class="product-image" alt="RUBY VIOLET">

        <!-- VIDEO SPECIFICI -->
        <video class="product-video" controls autoplay loop muted playsinline>
            <source src="IMG_2297.mov" type="video/quicktime">
        </video>
        <video class="product-video" controls autoplay loop muted playsinline>
            <source src="IMG_2298.mov" type="video/quicktime">
        </video>

        <h2 id="choose" data-translate="chooseQuantity">
            Scegli quantità
        </h2>
        <div class="sizes">
            <button onclick="addToCart('RUBY VIOLET 💜 - 10g')">10g</button>
            <button onclick="addToCart('RUBY VIOLET 💜 - 20g')">20g</button>
            <button onclick="addToCart('RUBY VIOLET 💜 - 50g')">50g</button>
            <button onclick="addToCart('RUBY VIOLET 💜 - 100g')">100g</button>
            <button onclick="addToCart('RUBY VIOLET 💜 - 500g')">500g</button>
        </div>
    </div>

    <!-- CARRELLO RESTYLING -->
    <div class="cart-card">
        <div class="cart-title-custom">
            <span>🛒</span> <span data-translate="cartTitle">Carrello</span>
        </div>
        <div id="mini-cart">
            <span data-translate="emptyCart">Carrello vuoto</span>
        </div>
    </div>

    <!-- BOTTONI DI NAVIGAZIONE COMPATTI AD ARCHITETTURA GRID (2 AFFIANCATI) -->
    <div class="action-buttons-grid">
        <a href="shop.html" class="btn-action primary" id="goCart">
            <span>🛒</span> <span data-translate="goToCart">Vai al carrello</span>
        </a>
        <a href="shop.html" class="btn-action" id="goMenu">
            <span>🏠</span> <span data-translate="backToMenu">Torna al menu</span>
        </a>
    </div>
</div>

<script>
/* TRADUZIONI INTEGRATE */
const translations = {
    it: {
        backToWeed: "← Torna a Weed",
        chooseQuantity: "Scegli quantità",
        cartTitle: "Carrello",
        emptyCart: "Carrello vuoto",
        goToCart: "Vai al carrello",
        backToMenu: "Torna al menu",
        addedToCart: "aggiunto al carrello"
    },
    en: {
        backToWeed: "← Back to Weed",
        chooseQuantity: "Choose quantity",
        cartTitle: "Cart",
        emptyCart: "Empty cart",
        goToCart: "Go to cart",
        backToMenu: "Back to menu",
        addedToCart: "added to cart"
    },
    es: {
        backToWeed: "← Volver a Weed",
        chooseQuantity: "Elige cantidad",
        cartTitle: "Carrito",
        emptyCart: "Carrito vacío",
        goToCart: "Ir al carrito",
        backToMenu: "Volver al menú",
        addedToCart: "añadido al carrito"
    },
    de: {
        backToWeed: "← Zurück zu Weed",
        chooseQuantity: "Menge wählen",
        cartTitle: "Warenkorb",
        emptyCart: "Warenkorb leer",
        goToCart: "Zum Warenkorb",
        backToMenu: "Zurück zum Menü",
        addedToCart: "zum Warenkorb hinzugefügt"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;
    
    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

/* GESTIONE CARRELLO */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(product) {
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
    const lang = getLanguage();
    const t = translations[lang] || translations.it;
    alert("✅ " + product + " " + t.addedToCart);
}

function showMiniCart() {
    const box = document.getElementById("mini-cart");
    if (!box) return;
    const lang = getLanguage();
    const t = translations[lang] || translations.it;
    
    if (cart.length === 0) {
        box.innerHTML = t.emptyCart;
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML += '<div class="cart-item-row"><span>• ' + item + '</span><button onclick="removeItem(' + index + ')">❌ Rimuovi</button></div>';
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
}

window.addEventListener("load", function() {
    translatePage();
    showMiniCart();
});
</script>
</body>
</html>
