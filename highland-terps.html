<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Highland Terps</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="section-title">

🌱 Highland Terps

</div>



<div class="product">


<img src="IMG_9708.png" class="product-image">


<img src="IMG_9709.png" class="product-image">



<h2>Scegli quantità</h2>



<div class="sizes">


<button onclick="addToCart('Highland Terps - 10g')">
10g
</button>


<button onclick="addToCart('Highland Terps - 20g')">
20g
</button>


<button onclick="addToCart('Highland Terps - 30g')">
30g
</button>


<button onclick="addToCart('Highland Terps - 40g')">
40g
</button>


<button onclick="addToCart('Highland Terps - 50g')">
50g
</button>


<button onclick="addToCart('Highland Terps - 100g')">
100g
</button>


<button onclick="addToCart('Highland Terps - 500g')">
500g
</button>


</div>


</div>



<br>



<div class="cart">


<div class="cart-title">

🛒 Il tuo ordine

</div>



<div id="mini-cart">

Carrello vuoto

</div>


</div>





<br>



<a href="index.html" class="category-link">

<div class="category">

🛒 Vai al carrello

</div>

</a>



<br>



<a href="index.html" class="category-link">

<div class="category">

🏠 Torna al menu principale

</div>

</a>



</div>







<script>


let cart = JSON.parse(localStorage.getItem("cart")) || [];



function addToCart(product){


cart.push(product);


localStorage.setItem("cart", JSON.stringify(cart));


showMiniCart();


alert("✅ " + product + " aggiunto al carrello");


}





function showMiniCart(){


let box = document.getElementById("mini-cart");



if(cart.length === 0){


box.innerHTML="Carrello vuoto";


return;


}



box.innerHTML="";



cart.forEach(function(item,index){


box.innerHTML +=

"• " + item +

" <button onclick='removeItem("+index+")'>❌</button><br><br>";


});


}




function removeItem(index){


cart.splice(index,1);


localStorage.setItem("cart", JSON.stringify(cart));


showMiniCart();


}




showMiniCart();



</script>



</body>

</html>
