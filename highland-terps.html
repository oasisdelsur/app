<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Highland Terps</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="section-title">

🌱 Highland Terps

</div>



<div class="product">


<img src="IMG_9708.png" class="product-image">


<img src="IMG_9709.png" class="product-image">



<h2>Scegli quantità</h2>



<div class="sizes">


<button onclick="addToCart('Highland Terps 10g')">
10g
</button>


<button onclick="addToCart('Highland Terps 20g')">
20g
</button>


<button onclick="addToCart('Highland Terps 30g')">
30g
</button>


<button onclick="addToCart('Highland Terps 40g')">
40g
</button>


<button onclick="addToCart('Highland Terps 50g')">
50g
</button>


<button onclick="addToCart('Highland Terps 100g')">
100g
</button>


<button onclick="addToCart('Highland Terps 500g')">
500g
</button>


</div>


</div>




<div class="cart">


<div class="cart-title">

🛒 Carrello

</div>


<div id="cart">

Nessun prodotto

</div>



<button class="checkout" onclick="sendOrder()">

📲 Invia Ordine Telegram

</button>


</div>



</div>





<script>


let cart = JSON.parse(localStorage.getItem("cart")) || [];



function addToCart(product){


cart.push(product);


localStorage.setItem("cart", JSON.stringify(cart));


showCart();


}




function showCart(){


let box = document.getElementById("cart");



if(cart.length === 0){

box.innerHTML="Nessun prodotto";

return;

}



box.innerHTML="";



cart.forEach((item,index)=>{


box.innerHTML +=

item +

' <button onclick="removeItem(' + index + ')">❌</button><br><br>';



});


}




function removeItem(index){


cart.splice(index,1);


localStorage.setItem("cart", JSON.stringify(cart));


showCart();


}





function sendOrder(){



if(cart.length === 0){


alert("Il carrello è vuoto");


return;


}



let ordine = cart.join("\n");



let messaggio =

"Ciao Oasis del Sur, vorrei ordinare:\n\n" + ordine;



let telegram =

"https://t.me/wordex17?text=" + encodeURIComponent(messaggio);



window.open(telegram,"_blank");



}




showCart();


</script>



</body>

</html>
