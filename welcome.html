<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oasis del Sur</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}
.welcome {
    padding: 30px;
}
.logo {
    width: 250px;
    height: 250px;
    object-fit: contain;
    border-radius: 50%;
    margin-bottom: 25px;
}
h1 {
    font-size: 32px;
    margin-bottom: 30px;
}
.enter {
    display: inline-block;
    background: #00e676;
    color: black;
    text-decoration: none;
    padding: 16px 60px;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
}
.enter:hover {
    background: #00ff88;
}
</style>
</head>
<body>
<div class="welcome">
<img
    src="IMG_9609.png"
    class="logo"
    alt="Oasis del Sur"
>
<h1>
    Benvenuto in Oasis del Sur
</h1>
<a
    href="shop.html"
    class="enter"
>
    ENTRA
</a>
</div>
</body>
</html>
