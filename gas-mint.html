<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gas Mint</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="back-button">

<a href="dry.html" id="back">
← Torna ai Dry
</a>

</div>

<div class="container">

<div class="section-title">
🌱 Gas Mint
</div>

<div class="product">

<img src="IMG_9794.png" class="product-image">

<img src="IMG_9795.png" class="product-image">

<img src="IMG_9796.png" class="product-image">

<video class="product-image" controls autoplay muted loop>
<source src="IMG_8834.mov" type="video/quicktime">
Il tuo browser non supporta il video.
</video>

<h2 id="choose">
Scegli quantità
</h2>

<div class="sizes">

<button onclick="addToCart('Gas Mint - 10g')">10g</button>

<button onclick="addToCart('Gas Mint - 20g')">20g</button>

<button onclick="addToCart('Gas Mint - 30g')">30g</button>

<button onclick="addToCart('Gas Mint - 40g')">40g</button>

<button onclick="addToCart('Gas Mint - 50g')">50g</button>

<button onclick="addToCart('Gas Mint - 100g')">100g</button>

<button onclick="addToCart('Gas Mint - 500g')">500g</button>

</div>

</div>


<div class="cart">

<div class="cart-title">

🛒 <span id="cartText">Il tuo ordine</span>

</div>

<div id="mini-cart">

Carrello vuoto

</div>

</div>


<a href="index.html" class="category-link">

<div class="category">

🛒 Vai al carrello

</div>

</a>


<a href="index.html" class="category-link">

<div class="category">

🏠 Torna al menu principale

</div>

</a>


</div>


<script src="language.js"></script>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];


function addToCart(product){

cart.push(product);

localStorage.setItem("cart", JSON.stringify(cart));

showMiniCart();

alert("✅ " + product + " aggiunto al carrello");

}


function showMiniCart(){

let box=document.getElementById("mini-cart");


if(cart.length===0){

box.innerHTML="Carrello vuoto";

return;

}


box.innerHTML="";


cart.forEach(function(item,index){

box.innerHTML += "• " + item + " <button onclick='removeItem("+index+")'>❌</button><br><br>";

});

}


function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

showMiniCart();

}


window.onload=function(){

let lang=localStorage.getItem("language") || "it";

let t=translations[lang];


document.getElementById("back").innerHTML=t.back;

document.getElementById("choose").innerHTML=t.choose || "Scegli quantità";

document.getElementById("cartText").innerHTML=t.cart;


showMiniCart();

}

</script>


</body>

</html>
