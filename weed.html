<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weed - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
<style>
.folder-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin: 25px 0;
}

.folder-card {
    display: flex;
    align-items: center;
    background: rgba(20, 30, 20, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 18px 20px;
    color: white;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease, background 0.2s ease;
}

.folder-card:hover {
    transform: translateY(-2px);
    background: rgba(30, 45, 30, 0.85);
}

.folder-icon {
    font-size: 24px;
    margin-right: 15px;
}

.folder-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}
</style>
</head>
<body>
<div class="container">
    <div class="section-title" id="weedTitle" data-translate="selectStrain">
        SELEZIONA IL TUO STRAIN
    </div>
    
    <div class="back-button">
        <a href="shop.html" id="back" data-translate="back">
            ← Indietro
        </a>
    </div>

    <div class="folder-list">
        <a href="ruby-violet.html" class="folder-card">
            <span class="folder-icon">📁</span>
            <span class="folder-title">RUBY VIOLET 💜</span>
        </a>

        <a href="super-lemon-haze.html" class="folder-card">
            <span class="folder-icon">📁</span>
            <span class="folder-title">SUPER LEMON HAZE 🍋</span>
        </a>
    </div>
</div>

<script>
/* TRADUZIONI */
const translations = {
    it: {
        selectStrain: "SELEZIONA IL TUO STRAIN",
        back: "← Indietro"
    },
    en: {
        selectStrain: "SELECT YOUR STRAIN",
        back: "← Back"
    },
    es: {
        selectStrain: "SELECCIONA TU STRAIN",
        back: "← Atrás"
    },
    de: {
        selectStrain: "WÄHLE DEINEN STRAIN",
        back: "← Zurück"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;
    
    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

// Esegue la traduzione subito all'apertura
translatePage();
</script>
</body>
</html>
