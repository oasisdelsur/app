<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weed - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<style>
.weed-coming {
    min-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 45px auto;
    position: relative;
    overflow: hidden;
    border-radius: 30px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,120,.10),
            transparent 55%
        ),
        rgba(10,10,10,.72);

    backdrop-filter: blur(18px);

    border: 1px solid rgba(0,255,120,.18);

    box-shadow:
        0 0 50px rgba(0,255,120,.08),
        0 20px 60px rgba(0,0,0,.8);
}

.weed-coming::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(0,255,120,.08);
    filter: blur(70px);
    animation: glow 4s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% {
        transform: scale(.85);
        opacity: .5;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

.weed-content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.weed-title {
    color: white;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 8px;
    margin: 0;

    text-shadow:
        0 0 20px rgba(0,255,120,.18);
}

.weed-status {
    margin-top: 18px;
    color: rgba(0,255,120,.75);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 4px;
}

.weed-line {
    width: 90px;
    height: 2px;
    margin: 25px auto;

    background: rgba(0,255,120,.5);

    box-shadow:
        0 0 15px rgba(0,255,120,.5);
}

.weed-message {
    color: rgba(255,255,255,.55);
    font-size: 15px;
    letter-spacing: 1px;
}

@media (max-width: 500px) {
    .weed-coming {
        min-height: 380px;
        margin: 30px auto;
    }

    .weed-title {
        font-size: 40px;
        letter-spacing: 6px;
    }

    .weed-status {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="section-title" id="weedTitle">
        WEED
    </div>

    <div class="back-button">
        <a href="shop.html" id="back">
            ← INDIETRO
        </a>
    </div>

    <div class="weed-coming">
        <div class="weed-content">

            <h1 class="weed-title">
                WEED
            </h1>

            <div class="weed-status">
                COMING SOON
            </div>

            <div class="weed-line"></div>

            <div class="weed-message">
                La selezione sta arrivando.
            </div>

        </div>
    </div>

</div>

</body>
</html>
