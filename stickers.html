<script>

let stickers = JSON.parse(localStorage.getItem("stickers")) || [];

document.getElementById("counter").innerHTML =
    "Hai scelto " + stickers.length + " / 5 stickers";

function addSticker(nome) {

    if (stickers.length >= 5) {
        alert("Hai già scelto 5 stickers per questo ordine 🎁");
        return;
    }

    stickers.push(nome);

    localStorage.setItem(
        "stickers",
        JSON.stringify(stickers)
    );

    document.getElementById("counter").innerHTML =
        "Hai scelto " + stickers.length + " / 5 stickers";

    alert("✅ " + nome + " aggiunto");
}

</script>
