/* TITOLO ULTRA-PREMIUM HOLOGRAPHIC (ISPIRATO ALL'ETICHETTA NEON) */
.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    box-sizing: border-box;
    
    /* GLASSMORPHISM SCURO CON BORDI E RIFLESSI OLOGRAFICI */
    background: linear-gradient(145deg, rgba(20, 15, 30, 0.95), rgba(10, 20, 15, 0.95));
    border: 1px solid rgba(255, 235, 59, 0.5);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    
    /* OMBRA LUSSUOSA E BAGLIORE PROFONDO HOLOGRAPHIC */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 18px rgba(255, 215, 0, 0.2);
    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

/* RIFLESSO DI LUCE PREMIUM SULLA SCHEDA */
.section-title-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    transition: 0.5s;
    animation: shine 6s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

.title-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    
    /* SFUMATURA HOLOGRAPHIC NEON (GIALLO - ARANCIONE - VERDE - AZZURRO) */
    background: linear-gradient(135deg, #ffffff 0%, #ffee58 25%, #ff7043 50%, #66bb6a 75%, #29b6f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    filter: drop-shadow(0 2px 10px rgba(255, 235, 59, 0.6));
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(255, 235, 59, 0.95);
    text-transform: uppercase;
    margin-top: 4px;
    border-top: 1px solid rgba(255, 235, 59, 0.3);
    padding-top: 4px;
    width: 60%;
}

/* GRIGLIA MEDIA 2x2 */
.media-grid-2 {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 20px auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.media-placeholder {
    width: 100%;
    height: 180px;
    border-radius: 18px;
    background: rgba(20, 15, 30, 0.75);
    border: 1px dashed rgba(255, 235, 59, 0.35);
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    box-sizing: border-box;
}

/* IMMAGINI E VIDEO */
.product-image, .product-video {
    width: 100%;
    height: 190px;
    display: block;
    border-radius: 18px;
    object-fit: cover;
    object-position: center;
}

/* SEZIONE QUANTITÀ COMPLETA E CENTRATA */
.quantity-section {
    text-align: center;
    margin: 25px 0 20px 0;
    width: 100%;
}
