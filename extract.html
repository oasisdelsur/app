<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extract - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">

<!-- FONT LUXURY & PREMIUM FROM GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
/* TITOLO ULTRA-PREMIUM (SENZA EMOJI VERDE) */
.section-title-container {
    width: 100%;
    max-width: 600px;
    margin: 15px auto 20px auto;
    padding: 18px 24px;
    box-sizing: border-box;
    
    background: linear-gradient(145deg, rgba(20, 25, 20, 0.95), rgba(10, 15, 10, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);
    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.section-title-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    transition: 0.5s;
    animation: shine 6s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

.section-title-text {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    
    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
}

.title-badge {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    margin-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 4px;
    width: 60%;
}

/* COMING SOON CARD */
.coming-soon-card {
    background: rgba(20, 30, 20, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    margin: 30px 0;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
}

.coming-soon-icon {
    font-size: 40px;
    margin-bottom: 15px;
}

.coming-soon-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.coming-soon-subtitle {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
}

/* CARRELLO INTEGRATO E COMPATTO */
.cart-card {
    background: rgba(10, 20, 12, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(50, 205, 50, 0.3);
    border-radius: 22px;
    padding: 20px;
    margin: 25px 0 20px 0;
    box-shadow: 0 0 20px rgba(50, 205, 50, 0.15), inset 0 0 15px rgba(50, 205, 50, 0.05);
}

.cart-title-custom {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #4CAF50;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
}

#mini-cart {
    font-size: 14px;
    color: #e0e0e0;
    margin-bottom: 16px;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.04);
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.cart-item-row button {
    background: rgba(255, 59, 48, 0.15);
    color: #ff453a;
    border: 1px solid rgba(255, 59, 48, 0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.cart-item-row button:hover {
    background: #ff3b30;
    color: #ffffff;
}

/* BOTTONI AZIONE INTEGRATI */
.cart-actions-integrated {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.btn-action-int {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 12px 8px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-action-int.primary {
    background: linear-gradient(135deg, #1e7e34, #155724);
    border: 1px solid rgba(76, 175, 80, 0.5);
    box-shadow: 0 4px 12px rgba(40, 167, 69, 0.25);
}

.btn-action-int:hover {
    background: rgba(255, 255, 255, 0.15);
}

.btn-action-int.primary:hover {
    background: linear-gradient(135deg, #28a745, #1e7e34);
}

@media (max-width: 500px) {
    .section-title-text {
        font-size: 22px;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="back-button">
        <a href="shop.html" id="back" data-translate="back">
            ← Indietro
        </a>
    </div>

    <!-- TITOLO PREMIUM SENZA EMOJI VERDE -->
    <div class="section-title-container">
        <span class="section-title-text">EXTRACT</span>
        <div class="title-badge">OASIS DEL SUR</div>
    </div>

    <!-- SEZIONE COMING SOON -->
    <div class="coming-soon-card">
        <div class="coming-soon-icon">⏳</div>
        <div class="coming-soon-title" data-translate="comingSoonTitle">PRODOTTI IN ARRIVO</div>
        <div class="coming-soon-subtitle" data-translate="comingSoonSubtitle">La sezione Extract sarà disponibile a breve.</div>
    </div>

    <!-- CARRELLO UNIFICATO -->
    <div class="cart-card">
        <div class="cart-title-custom">
            <span data-translate="cartTitle">CARRELLO</span> <span>🛒</span>
        </div>
        <div id="mini-cart">
            <span data-translate="emptyCart">Carrello vuoto</span>
        </div>

        <!-- BOTTONI AZIONE INTEGRATI NELLA SCHEDA -->
        <div class="cart-actions-integrated">
            <a href="shop.html#cart" class="btn-action-int primary" id="goCart">
                <span>🛒</span> <span data-translate="goToCart">Vai al carrello</span>
            </a>
            <a href="shop.html" class="btn-action-int" id="goMenu">
                <span>🏠</span> <span data-translate="backToMenu">Torna al menu</span>
            </a>
        </div>
    </div>
</div>

<script>
/* TRADUZIONI INTEGRATE COMPLETE */
const translations = {
    it: {
        back: "← Indietro",
        comingSoonTitle: "PRODOTTI IN ARRIVO",
        comingSoonSubtitle: "La sezione Extract sarà disponibile a breve.",
        cartTitle: "CARRELLO",
        emptyCart: "Carrello vuoto",
        goToCart: "Vai al carrello",
        backToMenu: "Torna al menu"
    },
    en: {
        back: "← Back",
        comingSoonTitle: "COMING SOON",
        comingSoonSubtitle: "The Extract section will be available soon.",
        cartTitle: "CART",
        emptyCart: "Empty cart",
        goToCart: "Go to cart",
        backToMenu: "Back to menu"
    },
    es: {
        back: "← Atrás",
        comingSoonTitle: "PRÓXIMAMENTE",
        comingSoonSubtitle: "La sección Extract estará disponible pronto.",
        cartTitle: "CARRITO",
        emptyCart: "Carrito vacío",
        goToCart: "Ir al carrito",
        backToMenu: "Volver al menú"
    },
    de: {
        back: "← Zurück",
        comingSoonTitle: "DEMNÄCHST",
        comingSoonSubtitle: "Der Bereich Extract ist in Kürze verfügbar.",
        cartTitle: "WARENKORB",
        emptyCart: "Warenkorb leer",
        goToCart: "Zum Warenkorb",
        backToMenu: "Zurück zum Menü"
    }
};

function getLanguage() {
    return localStorage.getItem("language") || "it";
}

function translatePage() {
    const lang = getLanguage();
    const texts = translations[lang] || translations.it;
    document.documentElement.lang = lang;
    
    document.querySelectorAll("[data-translate]").forEach(function(el) {
        const key = el.getAttribute("data-translate");
        if (texts[key]) {
            el.textContent = texts[key];
        }
    });
}

/* GESTIONE CARRELLO */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function showMiniCart() {
    const box = document.getElementById("mini-cart");
    if (!box) return;
    const lang = getLanguage();
    const t = translations[lang] || translations.it;
    
    if (cart.length === 0) {
        box.innerHTML = t.emptyCart;
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML += '<div class="cart-item-row"><span>• ' + item + '</span><button onclick="removeItem(' + index + ')">❌ Rimuovi</button></div>';
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    showMiniCart();
}

window.addEventListener("load", function() {
    translatePage();
    showMiniCart();
});
</script>
</body>
</html>
