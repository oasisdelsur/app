<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extract - Oasis del Sur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- TITOLO -->
    <div
        class="section-title"
        id="extractTitle"
    >
        🧪 Extract
    </div>
    <!-- INDIETRO -->
    <div class="back-button">
        <a
            href="shop.html"
            id="back"
        >
            ← Indietro
        </a>
    </div>
    <!-- PRODOTTI NON DISPONIBILI -->
    <div class="coming-soon">
        <div class="hourglass">
            ⏳
        </div>
        <h2 id="coming">
            Ancora non disponibili
        </h2>
        <p id="arrival">
            Prodotti in arrivo...
        </p>
    </div>
</div>
<!-- CARRELLO -->
<div class="cart">
    <div
        class="cart-title"
        id="cartTitle"
    >
        🛒 Carrello
    </div>
    <div id="cart">
        Nessun prodotto
    </div>
    <button
        class="checkout"
        id="orderButton"
        onclick="sendOrder()"
    >
        📲 Conferma ordine
    </button>
</div>
<script src="language.js"></script>
<script>
let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];
function showCart() {
    const box =
        document.getElementById("cart");
    if (!box) return;
    const lang =
        localStorage.getItem("language") || "it";
    const t =
        translations[lang] || translations.it;
    if (cart.length === 0) {
        box.innerHTML =
            t.emptyCart || "Nessun prodotto";
        return;
    }
    box.innerHTML = "";
    cart.forEach(function(item, index) {
        box.innerHTML +=
            item +
            ' <button onclick="removeItem(' +
            index +
            ')">❌</button>' +
            '<br><br>';
    });
}
function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );
    showCart();
}
function sendOrder() {
    const lang =
        localStorage.getItem("language") || "it";
    const t =
        translations[lang] || translations.it;
    if (cart.length === 0) {
        alert(
            t.emptyAlert ||
            "Il carrello è vuoto"
        );
        return;
    }
    const ordine =
        cart.join("\n");
    const messaggio =
        (t.orderMessage ||
        "Ciao Oasis del Sur, vorrei ordinare:") +
        "\n\n" +
        ordine;
    const telegram =
        "https://t.me/wordex17?text=" +
        encodeURIComponent(messaggio);
    window.location.href =
        telegram;
}
window.addEventListener(
    "load",
    function() {
        const lang =
            localStorage.getItem("language") || "it";
        if (typeof changeLanguage === "function") {
            changeLanguage(lang);
        }
        showCart();
    }
);
</script>
</body>
</html>
