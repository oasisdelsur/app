<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Extract - Oasis del Sur</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">



<div class="section-header">


<div class="section-title" id="extractTitle">

🧪 Extract

</div>



<div class="language-box">


<button class="language-button" onclick="openLanguage()">

🌐 Language ▾

</button>



<div class="language-menu" id="languageMenu">


<button onclick="changeLanguage('it')">
🇮🇹 Italiano
</button>


<button onclick="changeLanguage('es')">
🇪🇸 Español
</button>


<button onclick="changeLanguage('en')">
🇬🇧 English
</button>


<button onclick="changeLanguage('de')">
🇩🇪 Deutsch
</button>


</div>


</div>


</div>





<div class="back-button">

<a href="index.html" id="back">

← Indietro

</a>

</div>





<div class="coming-soon">


<div class="hourglass">

⏳

</div>



<h2 id="coming">

Ancora non disponibili

</h2>



<p id="arrival">

Prodotti in arrivo...

</p>



</div>




</div>







<div class="cart">


<div class="cart-title" id="cartTitle">

🛒 Carrello

</div>



<div id="cart">

Nessun prodotto

</div>



<button class="checkout" id="orderButton">

📲 Conferma ordine

</button>


</div>







<script src="language.js"></script>



<script>


function openLanguage(){

document.getElementById("languageMenu").classList.toggle("show");

}





function changeLanguage(lang){


localStorage.setItem("language",lang);


let t=translations[lang];



document.getElementById("extractTitle").innerHTML="🧪 "+t.extract;

document.getElementById("back").innerHTML=t.back;

document.getElementById("coming").innerHTML=t.coming;

document.getElementById("arrival").innerHTML=t.arrival;

document.getElementById("cartTitle").innerHTML=t.cart;

document.getElementById("orderButton").innerHTML=t.order;



document.getElementById("languageMenu").classList.remove("show");


}





window.onload=function(){


let saved=localStorage.getItem("language");


if(saved){

changeLanguage(saved);

}


}


</script>




</body>

</html>
