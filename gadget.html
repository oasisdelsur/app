<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadget - Oasis del Sur</title>
    <link rel="stylesheet" href="style.css">
    <style>
    /* ==========================
       STILI CARD STILO FROZEN
    ========================== */
    .gadget-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 20px;
    }

    .gadget-card {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        backdrop-filter: blur(5px);
        transition: transform 0.2s, background-color 0.2s;
    }

    .gadget-card:active, .gadget-card:hover {
        transform: scale(0.98);
        background: rgba(0, 0, 0, 0.6);
    }

    .gadget-card .icon {
        font-size: 24px;
    }

    /* ==========================
       MEDIA E GALLERIA
    ========================== */
    .media-container {
        display: none;
        margin-top: 25px;
        background: rgba(0, 0, 0, 0.3);
        padding: 20px;
        border-radius: 18px;
    }

    .product-media {
        width: 100%;
        max-width: 600px;
        height: auto;
        max-height: 400px;
        display: block;
        margin: 0 auto 15px auto;
        border-radius: 18px;
        object-fit: contain;
        background-color: #000;
    }

    .gallery-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
    }

    .gallery-btn {
        background-color: #333;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    .add-to-cart-btn {
        display: block;
        width: 100%;
        max-width: 300px;
        margin: 10px auto 0 auto;
        padding: 12px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }

    /* Tasto per chiudere la galleria e tornare alle schede */
    .close-btn {
        background: transparent;
        border: none;
        color: #ff4d4d;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 15px;
        text-decoration: underline;
    }
    </style>
</head>
<body>

<div class="back-button">
    <a href="shop.html">← Torna allo Shop</a>
</div>

<div class="container">
    <div class="section-title">
         🎁 GADGET
    </div>

    <!-- ELENCO SCHEDE STILE FROZEN -->
    <div id="gadget-menu" class="gadget-list">
        <div class="gadget-card" onclick="openGadget('CIMA WEED')">
            <span class="icon">📁</span>
            <span>CIMA WEED</span>
        </div>
        <div class="gadget-card" onclick="openGadget('KATANE 10cm')">
            <span class="icon">📁</span>
            <span>KATANE 10cm</span>
        </div>
        <div class="gadget-card" onclick="openGadget('TAPPETINI DUB')">
            <span class="icon">📁</span>
            <span>TAPPETINI DUB</span>
        </div>
    </div>

    <!-- SEZIONE GALLERIA FOTO/VIDEO PER CIMA WEED -->
    <div id="media-view" class="media-container">
        <button class="close-btn" onclick="closeGadget()">← Chiudi selezione</button>
        <h2 id="gadget-title" style="text-align: center; margin-bottom: 15px;"></h2>

        <div id="media-display"></div>

        <div id="gallery-controls-box" class="gallery-controls">
            <button class="gallery-btn" onclick="prevMedia()">❮ Indietro</button>
            <span id="media-counter">1 / 4</span>
            <button class="gallery-btn" onclick="nextMedia()">Avanti ❯</button>
        </div>

        <button class="add-to-cart-btn" onclick="addSelectedGadget()">Aggiungi al Carrello 🛒</button>
    </div>
</div>

<script>
const mediaList = [
    { type: 'image', src: 'IMG_1780.png' },
    { type: 'image', src: 'IMG_1781.png' },
    { type: 'image', src: 'IMG_1782.png' },
    { type: 'video', src: 'IMG_1688.mov' }
];

let currentMediaIndex = 0;
let currentSelectedGadget = '';

function openGadget(gadgetName) {
    currentSelectedGadget = gadgetName;
    document.getElementById('gadget-title').innerText = gadgetName;

    if (gadgetName === 'CIMA WEED') {
        document.getElementById('media-view').style.display = 'block';
        document.getElementById('gallery-controls-box').style.display = 'flex';
        currentMediaIndex = 0;
        updateMediaDisplay();
    } else {
        // Per gli altri gadget senza foto apre la vista standard di inserimento
        document.getElementById('media-view').style.display = 'block';
        document.getElementById('gallery-controls-box').style.display = 'none';
        document.getElementById('media-display').innerHTML = '<p style="text-align:center;">Seleziona per aggiungere al carrello</p>';
    }
}

function closeGadget() {
    document.getElementById('media-view').style.display = 'none';
}

function updateMediaDisplay() {
    const display = document.getElementById('media-display');
    const counter = document.getElementById('media-counter');
    const current = mediaList[currentMediaIndex];

    if (current.type === 'image') {
        display.innerHTML = `<img src="${current.src}" class="product-media" alt="Cima Weed">`;
    } else if (current.type === 'video') {
        display.innerHTML = `
            <video class="product-media" controls playsinline preload="metadata">
                <source src="${current.src}" type="video/quicktime">
                <source src="${current.src}" type="video/mp4">
            </video>`;
    }

    counter.textContent = (currentMediaIndex + 1) + ' / ' + mediaList.length;
}

function nextMedia() {
    currentMediaIndex = (currentMediaIndex + 1) % mediaList.length;
    updateMediaDisplay();
}

function prevMedia() {
    currentMediaIndex = (currentMediaIndex - 1 + mediaList.length) % mediaList.length;
    updateMediaDisplay();
}

function addSelectedGadget() {
    if (!currentSelectedGadget) return;
    let gadgets = JSON.parse(localStorage.getItem('gadgets')) || [];
    gadgets.push(currentSelectedGadget);
    localStorage.setItem('gadgets', JSON.stringify(gadgets));
    alert('✅ ' + currentSelectedGadget + ' aggiunto al carrello!');
}
</script>

</body>
</html>
