<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SIM - Oasis del Sur</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* ==========================
   SIM — SELEZIONE
========================== */

.sim-list {

    width: 100%;

    max-width: 700px;

    margin: 45px auto;

}


/* ==========================
   CARD SIM
========================== */

.sim-card {

    width: 100%;

    min-height: 140px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    box-sizing: border-box;

    border-radius: 30px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,120,.10),
            transparent 55%
        ),
        rgba(10,10,10,.72);

    backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(0,255,120,.18);

    box-shadow:
        0 0 50px
        rgba(0,255,120,.08),

        0 20px 60px
        rgba(0,0,0,.8);

    transition:
        .3s ease;

    cursor: pointer;
}


.sim-card:hover {

    transform:
        translateY(-5px);

    border-color:
        rgba(0,255,120,.40);

    box-shadow:
        0 0 30px
        rgba(0,255,120,.12),

        0 20px 60px
        rgba(0,0,0,.8);
}


.sim-name {

    color: white;

    font-size: 24px;

    font-weight: 900;

    letter-spacing: 2px;

    text-align: center;

    text-shadow:
        0 0 15px
        rgba(0,255,120,.12);
}


.sim-icon {

    font-size: 30px;

    margin-right: 12px;

    vertical-align: middle;
}


/* ==========================
   COMING SOON
========================== */

.sim-coming {

    min-height: 430px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 45px auto;

    position: relative;

    overflow: hidden;

    border-radius: 30px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,120,.10),
            transparent 55%
        ),
        rgba(10,10,10,.72);

    backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(0,255,120,.18);

    box-shadow:
        0 0 50px
        rgba(0,255,120,.08),

        0 20px 60px
        rgba(0,0,0,.8);
}


/* ==========================
   BAGLIORE
========================== */

.sim-coming::before {

    content: "";

    position: absolute;

    width: 280px;

    height: 280px;

    border-radius: 50%;

    background:
        rgba(0,255,120,.08);

    filter:
        blur(70px);

    animation:
        simGlow 4s ease-in-out infinite;
}


@keyframes simGlow {

    0%, 100% {

        transform:
            scale(.85);

        opacity: .5;

    }

    50% {

        transform:
            scale(1.15);

        opacity: 1;

    }

}


/* ==========================
   CONTENUTO COMING SOON
========================== */

.sim-content {

    position: relative;

    z-index: 2;

    text-align: center;
}


.sim-title {

    color: white;

    font-size: 52px;

    font-weight: 900;

    letter-spacing: 8px;

    margin: 0;

    text-shadow:
        0 0 20px
        rgba(0,255,120,.18);
}


.sim-status {

    margin-top: 18px;

    color:
        rgba(0,255,120,.75);

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 4px;
}


.sim-line {

    width: 90px;

    height: 2px;

    margin: 25px auto;

    background:
        rgba(0,255,120,.5);

    box-shadow:
        0 0 15px
        rgba(0,255,120,.5);
}


.sim-message {

    color:
        rgba(255,255,255,.55);

    font-size: 15px;

    letter-spacing: 1px;
}


/* ==========================
   NASCONDI / MOSTRA
========================== */

.hidden {

    display: none;
}


/* ==========================
   MOBILE
========================== */

@media (max-width: 500px) {

    .sim-list {

        margin: 30px auto;

    }


    .sim-card {

        min-height: 120px;

        padding: 20px;

        border-radius: 25px;

    }


    .sim-name {

        font-size: 19px;

        letter-spacing: 1px;

    }


    .sim-icon {

        font-size: 26px;

    }


    .sim-coming {

        min-height: 380px;

        margin: 30px auto;

    }


    .sim-title {

        font-size: 40px;

        letter-spacing: 6px;

    }


    .sim-status {

        font-size: 11px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ==========================
         TITOLO
    ========================== -->

    <div
        class="section-title"
        id="simTitle"
    >
        📱 SIM
    </div>


    <!-- ==========================
         INDIETRO
    ========================== -->

    <div class="back-button">

        <a
            href="shop.html"
            id="back"
        >
            ← Indietro
        </a>

    </div>


    <!-- ==========================
         SCHERMATA SELEZIONE
    ========================== -->

    <div
        id="simSelection"
        class="sim-list"
    >

        <div
            class="sim-card"
            onclick="showComingSoon()"
        >

            <span class="sim-icon">
                📱
            </span>

            <span
                class="sim-name"
                id="simDati"
            >
                SIM DATI LYCA +39
            </span>

        </div>

    </div>


    <!-- ==========================
         SCHERMATA COMING SOON
    ========================== -->

    <div
        id="comingSoon"
        class="sim-coming hidden"
    >

        <div class="sim-content">


            <h1 class="sim-title">
                SIM DATI
            </h1>


            <div class="sim-status">
                COMING SOON
            </div>


            <div class="sim-line"></div>


            <div class="sim-message">
                La selezione sta arrivando.
            </div>


        </div>

    </div>


</div>


<!-- ==========================
     LINGUA
========================== -->

<script src="language.js"></script>


<script>

function showComingSoon() {

    document
        .getElementById("simSelection")
        .classList.add("hidden");

    document
        .getElementById("comingSoon")
        .classList.remove("hidden");

}


window.addEventListener(
    "load",
    function() {

        const lang =
            localStorage.getItem(
                "language"
            ) || "it";


        if (
            typeof translations !== "undefined" &&
            translations[lang]
        ) {

            const t =
                translations[lang];


            document.documentElement.lang =
                lang;


            document.getElementById(
                "simTitle"
            ).innerHTML =
                "📱 " +
                (
                    t.sim ||
                    "SIM"
                );


            document.getElementById(
                "back"
            ).innerHTML =
                t.back;

        }

    }
);

</script>


</body>

</html>
