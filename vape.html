<body>

<div class="container">

<div class="section-title" id="vapeTitle">

<div class="back-button">

</a>

</div>


<div class="product">

<img src="IMG_9798.png" class="product-image">

<img src="IMG_9800.png" class="product-image">

<img src="IMG_9801.png" class="product-image">


<video class="product-image" controls autoplay muted loop>

<source src="IMG_8774.mov" type="video/quicktime">

Il tuo browser non supporta il video.

</video>


<h2 id="choose">

Scegli quantità

</h2>


<div class="sizes">

<button onclick="addToCart('Vape - 1 pezzo')">1</button>
<button onclick="addToCart('Vape - 2 pezzi')">2</button>
<button onclick="addToCart('Vape - 3 pezzi')">3</button>

<button onclick="addToCart('Vape - 5 pezzi')">5</button>

<button onclick="addToCart('Vape - 9 pezzi')">9</button>
<button onclick="addToCart('Vape - 10 pezzi')">10</button>

<button onclick="addToCart('Vape - 20 pezzi')">20</button>
<button onclick="addToCart('Vape - 30 pezzi')">30</button>
<button onclick="addToCart('Vape - 40 pezzi')">40</button>
<button onclick="addToCart('Vape - 50 pezzi')">50</button>

</div>

</div>


<div class="cart">

<div class="cart-title">

🛒 <span id="cartText">Il tuo ordine</span>

</div>


<div id="mini-cart">

Carrello vuoto

</div>


</div>


<a href="index.html" class="category-link">

<div class="category">

🛒 Vai al carrello

</div>

</a>


<a href="index.html" class="category-link">

<div class="category">

🏠 Torna al menu principale

</div>

</a>


</div>


<script src="language.js"></script>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];


function addToCart(product){

cart.push(product);

localStorage.setItem("cart", JSON.stringify(cart));

showMiniCart();

alert("✅ " + product + " aggiunto al carrello");

}


function showMiniCart(){

let box=document.getElementById("mini-cart");


if(cart.length===0){

box.innerHTML="Carrello vuoto";

return;

}


box.innerHTML="";


cart.forEach(function(item,index){

box.innerHTML += "• " + item + " <button onclick='removeItem("+index+")'>❌</button><br><br>";

});


}


function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

showMiniCart();

}


window.onload=function(){

let lang=localStorage.getItem("language") || "it";

let t=translations[lang];


document.getElementById("vapeTitle").innerHTML="💨 "+t.vape;

document.getElementById("back").innerHTML=t.back;

document.getElementById("choose").innerHTML=t.choose || "Scegli quantità";

document.getElementById("cartText").innerHTML=t.cart;


showMiniCart();

}

</script>


</body>

</html>
